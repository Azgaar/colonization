<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Interface directions</title>
<style>html,body{height:100%;margin:0}body{display:grid;grid-template-rows:40px 1fr;font:600 15px/1 system-ui,sans-serif;background:#22303a;color:#fff}nav{display:flex;align-items:stretch;gap:2px;padding:0 10px}nav button{font:inherit;color:#c9d6dc;background:none;border:0;padding:0 18px;cursor:pointer}nav button[aria-current=true]{background:#fff;color:#22303a}nav span{margin-left:auto;align-self:center;font-weight:400;color:#9db0b9}iframe{border:0;width:100%;height:100%}button:focus-visible{outline:2px solid #fff}</style></head>
<body><nav><button data-f="b8.html">B8. Tilted</button><button data-f="b7.html">B7. Clean B2</button><button data-f="b2.html">B2. Refined</button><button data-f="b4.html">B4. Triptych</button><button data-f="b5.html">B5. Living map</button><button data-f="b6.html">B6. Rails</button><button data-f="b3.html">B3. Vista</button><button data-f="b1.html">B1. First</button><span>Drag an agent, or click it</span></nav><iframe title="Prototype"></iframe>
<script>const f=document.querySelector('iframe'),b=[...document.querySelectorAll('button')];const go=(x)=>{b.forEach((y)=>y.setAttribute('aria-current',y===x));f.src=x.dataset.f;location.hash=x.dataset.f.slice(0,2)};b.forEach((x)=>x.onclick=()=>go(x));go(b.find((x)=>x.dataset.f.slice(0,2)===location.hash.slice(1))||b[0]);</script></body></html>
