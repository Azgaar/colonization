<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>B6 Placement rails</title><link rel="stylesheet" href="kit.css">
<style>
/* B6. Worker placement. Agents wait in a rail on the west side, action spaces stand in a rail on the east; the map keeps the full height between them.
   Lifting an agent turns the east rail into a full list of what that agent would get, with the reason where it would get nothing. Placed agents stay on their spaces until the round ends. */
:root{--l:126px;--r:150px}
.map-stage{position:fixed;left:var(--l);right:var(--r);top:0;bottom:0}
.rail{position:fixed;top:0;bottom:0;background:var(--deep);z-index:5;display:flex;flex-direction:column} .left{left:0;width:var(--l);padding:12px 12px 14px;gap:9px} .date{text-align:center;font:800 27px/1 var(--sc)} .date small{display:block;font:500 15px/1.25 var(--ui);margin-top:2px} .who{position:relative;display:block;width:100%;flex:1 1 0;min-height:0;max-height:134px;border-radius:14px;overflow:hidden;background:var(--bone);color:var(--ink);box-shadow:0 3px 10px #0007;transition:transform .15s} .who img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 6%} .who span{position:absolute;left:0;right:0;bottom:0;background:#f7f1e1f2;padding:3px 7px;line-height:1.1} .who b{font:800 15px/1.05 var(--sc);display:block} .who small{font-size:13.5px;white-space:nowrap} .who:hover{transform:translateX(5px)} .who.sel{transform:translateX(14px);box-shadow:0 0 0 4px var(--ochre)} .who.drag{opacity:.35} .who.swap::after{content:attr(data-tip);position:absolute;left:0;right:0;top:0;background:var(--ochre);color:var(--ink);font:800 14px/21px var(--ui);text-align:center} .left .sp{flex:1} .left .btn{background:#ffffff1c;border-radius:10px;padding:6px;text-align:center;font-weight:700} .left .pass{background:var(--scarlet);font:800 18px var(--sc)} .left .undo{background:var(--ochre);color:var(--ink)} .left [hidden]{display:none}
.right{right:0;width:var(--r);transition:width .24s cubic-bezier(.3,.7,.2,1);overflow:hidden;padding:10px;gap:6px;box-shadow:-4px 0 20px #0007} body.lift .right{width:340px} .right h3{font-size:16px;font-weight:500;display:flex;justify-content:space-between;align-items:baseline;flex:none;line-height:1} .tile{position:relative;display:grid;grid-template-columns:130px 1fr;border-radius:12px;background:#ffffff14;overflow:hidden;min-height:0;flex:1 1 0;max-height:72px} .tile .im{position:relative;min-height:0;height:100%} .tile .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover} .tile .im em{position:absolute;left:0;right:0;bottom:0;background:#0c2c31de;font:700 13.5px/1.1 var(--ui);padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .tile .im .plus{position:absolute;inset:0;display:grid;place-items:center;font:700 27px var(--ui);opacity:.55} .tile .tx{white-space:nowrap;padding:4px 12px;align-self:center;line-height:1.12;font-size:17px;width:190px} .tile .tx .yes{font-size:20px} .tile .tk{position:absolute;left:94px;top:5px;display:flex} .tile.ok{box-shadow:inset 0 0 0 3px var(--ochre);cursor:copy} .tile.off{opacity:.6} .tile.over.ok{background:var(--bone);color:var(--ink)}
.tile.t2{max-height:none;flex:none;display:block;padding:7px 8px} .tile.t2 h4{font-size:15.5px;display:flex;justify-content:space-between;gap:8px;line-height:1.1;font-weight:700;width:112px} body.lift .tile.t2 h4{width:auto} .tile.t2 h4 span{font:800 16px/1.1 var(--ui);text-align:right} .tile.t2 .no{font-weight:500;font-size:14.5px} .px{display:grid;grid-template-columns:repeat(5,21px);gap:0 2px;font:800 17px/1.1 var(--ui);text-align:center;margin-top:5px} .px span{display:flex;flex-direction:column;align-items:center} .px svg{width:18px;height:18px} .px i{display:block;width:20px;height:3px;border-radius:2px;background:#ffffff26;overflow:hidden;margin-top:2px} .px i b{display:block;height:100%;background:var(--bone)} body.lift .px{grid-template-columns:repeat(5,1fr);font-size:20px} body.lift .px svg{width:26px;height:26px} .fs{display:grid;grid-template-columns:repeat(5,21px);gap:2px;margin-top:5px} body.lift .fs{grid-template-columns:repeat(5,1fr);gap:6px} .fc{border-radius:6px;overflow:hidden;background:var(--bone);color:var(--ink);text-align:center} .fc img{width:100%;height:26px;object-fit:cover;object-position:50% 10%;display:block} body.lift .fc img{height:52px} .fc b{font:800 13.5px/16px var(--ui);display:block} body.lift .fc b{font-size:17px;line-height:22px} .fc.dear{opacity:.5}
.army{flex:none;border-radius:12px;background:#8a241a;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center} .army .n{font:800 34px/1 var(--sc);display:flex;gap:6px;align-items:center} .army p{margin:0;font-size:14px;line-height:1.15;display:none;width:200px} body.lift .army p{display:block}
.over1{position:fixed;left:calc(var(--l) + 14px);top:12px;display:flex;gap:18px;z-index:3;font-weight:800;font-size:22px;text-shadow:0 2px 5px #000c;align-items:center} .over1 span{display:flex;gap:6px;align-items:center} .court{position:fixed;right:calc(var(--r) + 14px);top:12px;display:flex;gap:12px;z-index:3;font:800 19px var(--sc);text-shadow:0 2px 5px #000c} .court span{display:flex;gap:6px;align-items:center} body.lift .court{opacity:.25}
.shelf{position:fixed;left:calc(var(--l) + 14px);bottom:14px;z-index:3;background:var(--glass);border-radius:14px;padding:8px 13px;display:flex;gap:20px;align-items:center} .shelf div{display:flex;gap:8px;align-items:center} .shelf h4{font-size:15.5px;font-weight:500} .sl{display:flex;gap:3px} .sl i{width:24px;height:25px;border-radius:5px;background:#ffffff17;display:grid;place-items:center} .sl i.has{background:#ffffff36} .tools{position:fixed;right:calc(var(--r) + 14px);bottom:14px;display:flex;gap:6px;z-index:3} .tools button{background:var(--glass);border-radius:10px;height:38px;min-width:38px;padding:0 12px;text-align:center;font-weight:700}
.note{position:fixed;left:calc(var(--l) + 14px);top:56px;z-index:4;background:var(--glass);border-radius:14px;padding:9px 16px;width:270px} .note[hidden]{display:none} .note h3{font-size:20px} .note dl{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;margin:3px 0 0} .note dt{opacity:.75} .note dd{margin:0;font-weight:700}
.table{position:fixed;left:calc(var(--l) + 22px);right:calc(var(--r) + 22px);bottom:14px;z-index:8;background:#0c2c31fa;border-radius:18px;padding:14px 20px;display:none;max-height:62vh;overflow:auto} body.war .table{display:block} body.war .shelf,body.war .tools{display:none} .table p{margin:0 0 8px;font-size:17px;display:flex;justify-content:space-between;gap:20px;align-items:center} .table p button{background:#ffffff24;border-radius:99px;padding:4px 16px;font-weight:800} .table table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums} .table th{text-align:left;font-weight:500;opacity:.75;font-size:15px;padding:0 12px 4px 0} .table td{padding:3px 12px 3px 0;font-weight:700;white-space:nowrap} .table td:nth-child(3),.table td:nth-child(4){font:800 21px var(--sc)} .table td:nth-child(3){color:#ff9a82} .table tr[data-war]{cursor:pointer} .table tr[data-war]:hover td,.table tr.on td{background:#ffffff14} .table .fell{color:#ff9a82} .table .held{color:#93e09c} .table tr.det td{white-space:normal;padding:2px 0 10px} .rs{display:grid;gap:5px;max-width:720px}
</style></head><body>
<div class="map-stage"><div class="map-inner"><canvas class="terrain"></canvas><svg class="marks"></svg></div></div>
<div class="over1" id="purse"></div><div class="court" id="court"></div><div class="note" id="note" hidden></div><div class="shelf" id="shelf" data-solid></div><div class="tools" id="tools"></div>
<aside class="rail left" id="left" data-solid></aside><aside class="rail right" id="right" data-solid></aside><section class="table" id="war" data-solid></section>
<script src="textures.js"></script><script src="snapshot.js"></script><script src="core.js"></script><script src="panels.js"></script><script src="rich.js"></script><script src="kit.js"></script>
<script>
const $ = (i) => document.getElementById(i), { D, P, t, pick, icon, art, me } = Core, K = Kit, S = K.S, L = K.L;
function paint() {
  const sp = K.spaces(S.card), A = K.army(), slots = (x, cap) => { const l = Core.RES.flatMap((r) => Array(x[r]).fill(r)); return `<span class="sl">${Array.from({ length: cap }, (_, i) => `<i class="${l[i] ? 'has' : ''}">${l[i] ? icon(l[i], 19) : ''}</i>`).join('')}</span>`; };
  $('left').innerHTML = `<div class="date">${D.year}<small>${t('round')} ${D.round}/10<br>${t('tax')} ${D.tax}</small></div>${P.hand.map((c) => `<button class="who${S.card === c ? ' sel' : ''}${S.drag === c ? ' drag' : ''}${S.card && sp[`who:${c}`] ? ' swap' : ''}" data-agent="${c}" data-space="who:${c}" data-tip="${L('Exchange', 'Обмен')}"><img src="${art.agent(c)}" alt=""><span><b>${pick(D.agents[c])}</b><small>${Core.eduIcon(D.agents[c].edu)} ${Core.traits(c).join(' ')}</small></span></button>`).join('')}<div class="sp"></div><button class="btn undo" data-undo ${Rich.history.length ? '' : 'hidden'}>${t('undo')}</button><button class="btn pass" data-pass>${t('pass')}</button>`;
  const lots = Array.from({ length: 6 }, (_, i) => { const b = P.buildings[i]; return `<div class="tile" data-space="lot:${i}"><div class="im">${b ? `<img src="${art.building(b)}" alt=""><em>${pick(D.buildings[b])}</em>` : '<span class="plus">+</span>'}</div><div class="tx">${S.card ? K.label(sp[`lot:${i}`]) : ''}</div><span class="tk">${K.tokens(`lot:${i}`)}</span></div>`; }).join('');
  const t2 = (id, name, body) => `<div class="tile t2" data-space="eu:${id}"><h4>${name}<span>${S.card ? K.label(sp[`eu:${id}`]) : ''}</span></h4>${body}<span class="tk">${K.tokens(`eu:${id}`)}</span></div>`;
  $('right').innerHTML = `<h3>${pick(D.names.nations[P.nation])}</h3>${lots}<h3 style="margin-top:5px">${t('europe')} ${K.away()}</h3>${t2('market', t('market'), `<div class="px">${Core.RES.map((r) => `<span title="${pick(D.names.resources[r])}">${icon(r, 20)}${D.price[r]}<i title="${t('demand')}"><b style="width:${(D.demand[r] / D.players.length) * 100}%"></b></i></span>`).join('')}</div>`)}${t2('pier', t('pier'), `<div class="fs">${D.pier.map(([x]) => `<span class="fc${D.agents[x].price > P.gold ? ' dear' : ''}" title="${pick(D.agents[x])}"><img src="${art.agent(x)}" alt=""><b>${D.agents[x].price}</b></span>`).join('')}</div>`)}${t2('salon', t('salon'), `<div class="fs">${D.salon.map((x) => `<span class="fc${D.fathers[x].bells > P.bells ? ' dear' : ''}" title="${pick(D.fathers[x])}"><img src="${art.father(x)}" alt=""><b>${D.fathers[x].bells}</b></span>`).join('')}</div>`)}<button class="army" data-war="0" title="${L(`If the war came now: ${A.pool} against ${A.targets} colonies`, `Война сейчас: ${A.pool} на ${A.targets} колоний`)}"><span class="n">${icon('ref', 28)}${A.ref}</span><p>${L(`War now: ${A.pool} against ${A.targets} colonies, ${Math.floor(A.pool / A.targets)}–${Math.ceil(A.pool / A.targets)} each. Loyalist: ${Panels.name(A.loyal)}`, `Война сейчас: ${A.pool} на ${A.targets} колоний. Лоялист: ${Panels.name(A.loyal)}`)}</p></button>`;
  $('purse').innerHTML = ['gold', 'bells', 'crosses'].map((k) => `<span title="${t(k)}">${icon(k, 25)}${P[k]}</span>`).join('');
  $('court').innerHTML = D.players.map((p, i) => `<span title="${Panels.name(i)}: ${p.bells} ${t('bells')}, ${p.gold} ${t('gold')}">${K.em(i, 34)}${p.score}</span>`).join('');
  $('shelf').innerHTML = `<div><h4>${t('warehouse')} ${Rich.total(P.wh)}/${D.cap}</h4>${slots(P.wh, D.cap)}</div><div><h4>${t('hold')}</h4>${slots(P.hold, 4)}</div>`;
  $('tools').innerHTML = `<button data-zoom="1.25">+</button><button data-zoom=".8">−</button><button data-lang>${Core.lang() === 'ru' ? 'EN' : 'RU'}</button>`;
  const v = S.look !== null && !S.card ? Core.settlementAt(S.look) : null, c = S.look !== null && !S.card ? Core.colonyAt(S.look) : null;
  $('note').hidden = !v && !c; if (v) $('note').innerHTML = `<h3>${pick(D.names.tribes[v.tribe])}</h3><dl><dt>${t('population')}</dt><dd>${v.pop}</dd><dt>${t('hostility')}</dt><dd>${v.hostility}</dd><dt>${t('loot')}</dt><dd>${v.loot.gold ? v.loot.gold + icon('gold', 17) : v.loot.amount + icon(v.loot.res, 17)}</dd></dl><span class="dim">${v.hostility >= 4 ? t('raid') : v.hostility === 3 ? t('calm') : t('gift')}</span>`; else if (c) $('note').innerHTML = `<h3>${Panels.name(c.owner)}</h3><dl><dt>${t('defence')}</dt><dd>${c.defence}</dd><dt>${L('Redcoats if war came now', 'Красных, если война сейчас')}</dt><dd>${A.per[c.cell] ?? 0}</dd></dl>`;
  if (S.war >= 0) $('war').innerHTML = `<p><span>${K.war.head()}</span><button data-peace>${t('close')}</button></p><table><thead><tr><th>${t('colony')}</th><th>${t('cubes')}</th><th>${t('attack')}</th><th>${t('defence')}</th><th>${t('odds')}</th><th>${t('dice')}</th><th></th></tr></thead><tbody>${D.war.sieges.map((x, i) => `<tr data-war="${i}" class="${i === S.war ? 'on' : ''}"><td>${K.em(x.owner, 26)} ${Panels.name(x.owner)}</td><td>${x.cubes}</td><td>${x.attack.total}</td><td>${x.defence.total}</td><td>${(K.odds(x) * 100).toFixed(0)}%</td><td><span class="dice">${(x.dice || []).map((d) => `<i class="${d === 4 || d === 5 ? 'hit' : ''}">${d}</i>`).join('')}</span></td><td class="${x.fell ? 'fell' : 'held'}">${x.fell ? t('falls') : t('holds')}</td></tr>${i === S.war ? `<tr class="det"><td colspan="7"><div class="rs">${K.war.bar(x.attack, 'atk')}${K.war.bar(x.defence, 'def')}</div></td></tr>` : ''}`).join('')}</tbody></table><h3 style="margin:10px 0 6px;font-size:19px">${t('result')}</h3>${K.war.scores()}`;
}
K.onWar = () => { const x = D.war.sieges[S.war]; if (x) K.stage.look(x.cell + Core.W * 3); };
K.start({ paint, marks: () => (S.war >= 0 ? { war: (c) => K.war.plate(c, 99) } : {}), stage: { zoom: 1.3, center: K.home().cell + 2, min: 0.55, max: 2.6 } });
</script></body></html>
