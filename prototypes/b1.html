<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>B1 Painted world</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Painted world. A living landscape fills the screen; people are the interface: your agents stand along the bottom as full illustrations, rivals watch from the top.
   Europe and the colony are places you go to, painted full-screen scenes, instead of panels. */
:root { --deep:#12393a; --deep2:#1b4c4a; --bone:#f5efdd; --ink:#1d2b2a; --scarlet:#cf4a35; --ochre:#e2a93b; --line:#3b6f6a; --sc:"Alegreya SC", Georgia, serif; --ui:"Alegreya Sans", "Gill Sans", sans-serif; }
*{box-sizing:border-box} html,body{height:100%;margin:0} body{background:var(--deep);color:var(--bone);font:500 17px/1.3 var(--ui);overflow:hidden} button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left} :focus-visible{outline:3px solid var(--ochre);outline-offset:2px} h2,h3,h4{font-family:var(--sc);margin:0;font-weight:700} .ic{vertical-align:-.22em;flex:none} .dim{opacity:.7}
.map-stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none} .map-inner{position:absolute;transform-origin:0 0;width:1024px;height:1024px} .map-inner>*{position:absolute;inset:0;width:100%;height:100%}
.vig{position:fixed;inset:0;pointer-events:none;background:linear-gradient(#0c2a2ccc,transparent 110px),linear-gradient(transparent calc(100% - 290px),#0c2a2ce6)}
.top{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;padding:12px 18px;gap:18px} .year{font:800 34px/1 var(--sc)} .year small{display:block;font:500 16px var(--ui);opacity:.85;margin-top:3px} .stats{display:flex;gap:20px;margin-top:4px} .stat{display:flex;gap:7px;align-items:center;font-size:25px;font-weight:800;text-shadow:0 2px 4px #0008} .stat .lbl{display:none}
.courts{display:flex;gap:10px} .riv{display:flex;flex-direction:column;align-items:center;width:78px;text-shadow:0 1px 3px #000a} .em{width:54px;height:54px;border-radius:50%;background-color:var(--c);display:grid;place-items:center;border:3px solid var(--bone);box-shadow:0 3px 8px #0007} .em{background-image:repeating-linear-gradient(0deg,#ffffff1a 0 1px,#0000 1px 3px),repeating-linear-gradient(90deg,#0000001f 0 1px,#0000 1px 3px)} .em img{width:38px;filter:drop-shadow(0 1.5px 1.5px #000a)} .riv .nm,.riv .v:nth-of-type(n+4){display:none} .riv .sc{order:2;font:800 20px var(--sc)} .riv .v{font-size:14px;display:none} .riv .v:nth-of-type(3){display:flex;gap:3px;order:3;align-items:center} .riv.me .em{border-color:var(--ochre)}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;gap:0;padding:0 250px;pointer-events:none} .card{pointer-events:auto;position:relative;width:136px;height:214px;margin:0 3px;border-radius:12px 12px 0 0;overflow:hidden;background:var(--bone);color:var(--ink);box-shadow:0 -4px 18px #0007;transform:translateY(26px);transition:transform .18s;border:4px solid var(--bone);border-bottom:0} .card img{width:100%;height:126px;object-fit:cover;object-position:50% 12%;display:block} .card .nm{display:block;font:800 15.5px/1 var(--sc);padding:6px 7px 0} .card .tr{display:block;font-size:14.500px;padding:2px 8px;white-space:nowrap} .card:hover{transform:translateY(10px)} .card.sel{transform:translateY(0);border-color:var(--ochre);z-index:3}
.round{position:fixed;bottom:24px;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;text-align:center;font:800 20px/1.05 var(--sc);border:5px solid var(--bone);box-shadow:0 6px 20px #0008} .go-eu{left:24px;background:#26566d url(art/europe.webp) 50%/cover;text-shadow:0 2px 5px #000} .go-col{left:142px;bottom:14px;width:92px;height:92px;font-size:16px;background:#4d7a3d 50%/cover;text-shadow:0 2px 5px #000} .go-pass{right:24px;background:var(--scarlet)} .go-pass small{display:block;font:500 14px var(--ui)}
.acts{position:fixed;left:50%;bottom:226px;transform:translateX(-50%);background:#12393af2;border:3px solid var(--bone);border-radius:16px;padding:10px 18px 14px;max-width:min(940px,94vw);max-height:46vh;overflow:auto} .acts[hidden]{display:none} .acts .in{display:flex;gap:26px;flex-wrap:wrap} .grp{min-width:150px;max-width:250px} .grp h4{font-size:16px;color:var(--ochre);margin-bottom:3px} .act{display:flex;width:100%;gap:10px;justify-content:space-between;align-items:baseline;padding:3px 0;font-weight:700;font-size:18px} .act.off{display:none} .act.sel,.act:hover{color:var(--ochre)} .opts{display:flex;flex-direction:column;gap:3px;margin:2px 0 6px} .opt{background:var(--deep2);border-radius:8px;padding:4px 10px} .opt:hover{background:var(--line)} .showoff .act.off{display:flex;opacity:.55;font-weight:500;font-size:16px} .why{text-align:right;font-size:14px} .tog{display:block;margin-left:auto;font-size:15px;opacity:.75;text-decoration:underline}
.note{position:fixed;right:18px;top:150px;width:310px;background:#12393af2;border:3px solid var(--bone);border-radius:16px;padding:14px 18px} .note[hidden]{display:none} .native img{width:100%;height:170px;object-fit:cover;object-position:50% 25%;border-radius:8px} dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0} dt{opacity:.75} dd{margin:0} .note h3{font-size:24px;margin-top:6px}
.pip{display:inline-block;width:13px;height:13px;border-radius:50%;background:#0005;margin-right:3px} .pip.on{background:var(--bone)} .pip.bad.on{background:#f0573c} .pip.mid.on{background:var(--ochre)} .pip.ok.on{background:#7cc47f}
.scene{position:fixed;inset:0;display:none;overflow:auto;padding:26px 34px 40px;background-size:cover;background-position:50%} .scene::before{content:"";position:fixed;inset:0;background:linear-gradient(100deg,#0c2a2cd9 20%,#0c2a2c59 70%,#0c2a2c8c)} .scene>*{position:relative} body[data-view=europe] .s-eu,body[data-view=colony] .s-col,body[data-view=war] .s-war{display:block} .scene h2{font:800 46px/1 var(--sc);margin-bottom:16px} .scene h4{font-size:22px;margin-bottom:8px} .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:26px} .back{position:fixed;right:28px;top:24px;background:var(--bone);color:var(--ink);border-radius:99px;padding:8px 22px;font:800 19px var(--sc);z-index:3}
.mkt{border-collapse:separate;border-spacing:0 5px;font-size:19px} .mkt th{text-align:left;padding-right:24px;font-weight:700;white-space:nowrap} .mkt .pr i{display:inline-block;width:34px;height:32px;line-height:32px;text-align:center;font-style:normal;background:#0c2a2c99;margin-right:2px;opacity:.55} .mkt .pr .lo{opacity:.9} .mkt .pr .on{background:var(--ochre);color:var(--ink);font-weight:800;opacity:1;border-radius:6px} .mkt .dm{padding-left:16px}
.row{display:flex;gap:12px;flex-wrap:wrap} .mini{position:relative;width:126px;background:var(--bone);color:var(--ink);border-radius:10px;overflow:hidden;display:block;padding-bottom:6px;box-shadow:0 5px 16px #0007} .mini img{width:100%;height:112px;object-fit:cover;object-position:50% 14%;display:block} .mini .nm{display:block;font:800 16px/1.05 var(--sc);padding:6px 8px 0} .mini .tr{display:block;font-size:14px;padding:1px 8px} .mini .cost{position:absolute;right:6px;top:6px;background:var(--ink);color:#fff;border-radius:99px;padding:2px 9px 2px 5px;font-weight:800} .mini.dear{filter:saturate(.25) brightness(.82)} .mini.empty{background:#ffffff1f;color:var(--bone);height:150px;display:grid;place-items:center;box-shadow:none;border:2px dashed #ffffff55}
.plans{display:grid;grid-template-columns:repeat(7,1fr);gap:10px} .plan{background:#0c2a2cb3;border-radius:10px;overflow:hidden;font-size:15px;line-height:1.15;padding-bottom:5px} .plan img{width:100%;height:62px;object-fit:cover;display:block} .plan span,.plan small{display:block;padding:2px 7px 0} .plan.gone{opacity:.35} .plan.own{outline:3px solid var(--ochre)}
.cells{display:grid;grid-template-columns:repeat(3,96px);gap:4px} .cl{height:96px;border-radius:10px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px 9px;font-size:20px;text-shadow:0 1px 3px #000;background:#7aa13f} .t-ocean{background:#1f6f9a} .t-forest{background:#3f6a32} .t-mountains{background:#7d7a72} .t-desert{background:#c9a862} .t-tundra{background:#9fb0ac} .cl.here{outline:4px solid var(--ochre)} .cl img{width:38px;filter:drop-shadow(0 1px 2px #000b)} .y{display:inline-flex;gap:3px;align-items:center;font-weight:800} .meta{font-size:19px}
.slots{display:flex;flex-wrap:wrap;gap:6px;max-width:300px} .slot{width:44px;height:44px;border-radius:8px;background:#0c2a2c99;display:grid;place-items:center} .blds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px} .bld{margin:0;border-radius:12px;overflow:hidden;background:var(--bone);color:var(--ink)} .bld img{width:100%;height:104px;object-fit:cover;display:block} .bld figcaption{font:800 18px/1.1 var(--sc);padding:6px 10px 8px} .bld small{float:right;font:700 15px var(--ui)} .bld.empty{background:#ffffff1f;color:var(--bone);min-height:140px;display:grid;place-items:center;border:2px dashed #ffffff55}
.sieges{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px} .siege{background:#0c2a2ccc;border-radius:14px;padding:12px 16px;border-top:6px solid var(--c)} .siege header{display:flex;gap:10px;align-items:center} .siege header .em{width:40px;height:40px} .siege header .em img{width:28px} .siege h3{flex:1;font-size:22px} .force{display:grid;grid-template-columns:44px 1fr;align-items:center;margin-top:6px} .force>b{font:800 28px var(--sc)} .parts{display:flex;min-width:0;height:30px;gap:2px;font-size:13px} .parts span{background:#3c7a68;padding:6px;overflow:hidden;white-space:nowrap;min-width:0;border-radius:4px} .parts em{font-style:normal;font-weight:800} .atk .parts span{background:#a83b2a} .siege footer{display:flex;gap:12px;margin-top:9px;align-items:center;flex-wrap:wrap} .dice{display:flex;gap:3px} .dice i{font-style:normal;width:22px;height:22px;border-radius:5px;background:var(--bone);color:var(--ink);text-align:center;font-weight:800;line-height:22px;font-size:15px} .dice .hit{background:var(--scarlet);color:#fff} .odds{flex:1;opacity:.8;font-size:15px} .out{font:800 21px var(--sc)} .siege.fell .out{color:#ff9077} .siege:not(.fell) .out{color:#8fdc98} .final{margin-top:22px;max-width:760px} .final .riv{display:grid;grid-template-columns:54px 220px 1fr 50px;width:auto;gap:14px;margin-bottom:8px} .final .riv .nm{display:block;font:700 20px var(--sc)} .final .riv .sc{font-size:30px;text-align:right;order:0} .warhead p{font-size:20px;margin:0 0 16px}
.tools{position:fixed;right:18px;top:108px;display:flex;gap:6px;font-weight:700} .tools button{background:#12393ad9;border:2px solid #ffffff55;border-radius:99px;padding:2px 13px} .toast{position:fixed;left:50%;top:80px;transform:translate(-50%,-140px);background:var(--bone);color:var(--ink);font-weight:700;border-radius:99px;padding:9px 22px;transition:transform .2s} .toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="map-stage"><div class="map-inner"><canvas class="terrain"></canvas><svg class="marks"></svg></div></div><div class="vig"></div>
<header class="top"><div class="year" id="year"></div><div class="stats" id="stats"></div><div class="courts" id="courts"></div></header><div class="tools" id="tools"></div>
<div class="note" id="note" hidden></div><div class="acts" id="acts" hidden></div><div class="dock" id="hand"></div>
<button class="round go-eu" data-view="europe" id="eu"></button><button class="round go-col" data-view="colony" id="col"></button><button class="round go-pass" id="pass"></button>
<section class="scene s-eu" style="background-image:url(art/europe.webp)" id="sEu"></section><section class="scene s-col" id="sCol"></section><section class="scene s-war" style="background-image:url(art/event/global_event_back.webp)" id="sWar"></section>
<script src="textures.js"></script><script src="snapshot.js"></script><script src="core.js"></script><script src="panels.js"></script>
<script>
const $ = (i) => document.getElementById(i), { D, P, t, pick } = Core;
let all = false;
document.addEventListener('click', (e) => { if (e.target.closest('.tog')) { all = !all; Panels.paint(); } });
Panels.S.onCell = (c) => { if (D.zone[c] === 'europe') Panels.S.view = 'europe'; const col = Core.colonyAt(c); if (col && col.owner === Core.me && !Panels.S.action) Panels.S.view = 'colony'; };
const back = () => `<button class="back" data-close>${t('map')}</button>`;
Panels.start({ skin: 'painted', zoom: 1.42, center: Panels.S.focus.cell + 2, render(S) {
  $('year').innerHTML = `${D.year}<small>${t('round')} ${D.round} ${t('of')} 10. ${t('tax')} ${D.tax}</small>`;
  $('stats').innerHTML = Panels.stats() + `<span class="stat" title="${t('ref')}">${Core.icon('ref', 24)}<b>${D.ref}</b></span>`;
  $('courts').innerHTML = Panels.rivals();
  $('tools').innerHTML = `<button data-zoom="1.25">+</button><button data-zoom=".8">−</button><button data-view="war">${t('warshort')}</button><button data-lang>${Core.lang() === 'ru' ? 'English' : 'Русский'}</button>`;
  $('hand').innerHTML = P.hand.map((c) => Panels.card(c, S.card === c ? 'sel' : '')).join('');
  $('eu').textContent = t('europe'); $('col').textContent = t('colony'); $('col').style.backgroundImage = `url(${Core.art.nation(P.nation)})`; $('pass').innerHTML = `<span>${t('pass')}<small>${P.deck} ${t('deck')}</small></span>`;
  $('acts').hidden = !S.card; $('acts').className = 'acts' + (all ? ' showoff' : ''); $('acts').innerHTML = S.card ? `<button class="tog">${t('why')}</button><div class="in">${Panels.actions(S.card, S.action)}</div>` : '';
  document.querySelectorAll('.acts .grp').forEach((g) => { g.hidden = !all && !g.querySelector('.act:not(.off)'); });
  const st = S.sel !== null && Core.settlementAt(S.sel), show = S.sel !== null && !(Core.colonyAt(S.sel)?.owner === Core.me);
  $('note').hidden = !show; if (show) $('note').innerHTML = st ? Panels.native(st) : Core.colonyAt(S.sel) ? `<h3>${Panels.name(Core.colonyAt(S.sel).owner)}</h3><p>${t('defence')} <b>${Core.colonyAt(S.sel).defence}</b></p>` : Panels.cell(S.sel);
  $('sEu').innerHTML = back() + `<h2>${t('europe')}</h2><div class="grid"><div style="grid-column:span 5"><h4>${t('market')}</h4>${Panels.market()}<h4 style="margin-top:18px">${t('hold')}</h4>${Panels.hold()}</div><div style="grid-column:span 7"><h4>${t('pier')}</h4>${Panels.pier()}<h4 style="margin-top:18px">${t('salon')}</h4>${Panels.salon()}</div><div style="grid-column:span 12"><h4>${t('plans')}</h4>${Panels.plans()}</div></div>`;
  $('sCol').style.backgroundImage = `url(${Core.art.nation(P.nation)})`;
  $('sCol').innerHTML = back() + `<h2>${pick(D.names.nations[P.nation])}</h2><div class="grid"><div style="grid-column:span 4"><h4>${t('colony')}</h4>${Panels.colony(S.focus.owner === Core.me ? S.focus : D.colonies.find((c) => c.owner === Core.me), S.card || P.hand[0])}<h4 style="margin-top:14px">${t('warehouse')}</h4>${Panels.warehouse()}<h4 style="margin-top:14px">${t('hold')}</h4>${Panels.hold()}</div><div style="grid-column:span 8"><h4>${t('buildings')}</h4>${Panels.buildings()}<h4 style="margin-top:18px">${t('fathers')}</h4>${Panels.fathers()}</div></div>`;
  $('sWar').innerHTML = back() + Panels.war();
} });
</script></body></html>
