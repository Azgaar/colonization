<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>B5 Living map</title><link rel="stylesheet" href="kit.css">
<style>
/* B5. One map and nothing else. Europe is a painted coast at the eastern edge of the same map; a colony's buildings bloom around the town.
   Lifting an agent eases the camera back until every place that agent could go is in view, then returns. */
.map-stage{position:fixed;inset:0;background:#0e4468} .map-inner{transition:none} .map-inner.ease{transition:transform .42s cubic-bezier(.3,.7,.2,1)}
.coast{position:absolute;left:984px;top:0;width:470px;height:1024px} .coast>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible} .city{position:absolute;background-size:cover;border-radius:26px;-webkit-mask:radial-gradient(closest-side,#000 70%,#0000);mask:radial-gradient(closest-side,#000 70%,#0000)} .name{position:absolute;font:800 44px var(--sc);color:#2c3a2c;letter-spacing:.02em}
.spot{position:absolute;left:92px;width:350px;border-radius:20px;background:#f7f1e1f0;color:var(--ink);padding:12px 16px 14px;box-shadow:0 8px 20px #0006;transition:box-shadow .15s} .spot h4{font-size:24px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;line-height:1.05} .spot h4 span{font:800 18px/1.1 var(--ui);text-align:right} .spot.ok{box-shadow:0 0 0 6px var(--ochre),0 8px 20px #0006} .spot.off{background:#e9e4d6b8} .spot.over.ok{background:#ffe6a0} .spot .no{font-weight:500;font-size:16px}
.px{display:grid;grid-template-columns:repeat(5,1fr);margin-top:8px;text-align:center;font:800 25px/1.1 var(--ui)} .px span{display:flex;flex-direction:column;align-items:center} .px .dm{flex-direction:row;gap:3px;margin-top:3px} .px .dm i{width:8px;height:8px;border-radius:50%;background:#1c2a2a26} .px .dm i.on{background:var(--ink)} .fs{display:flex;gap:7px;margin-top:9px} .fc{flex:1;border-radius:11px;overflow:hidden;background:#fff8;min-width:0} .fc img{width:100%;height:72px;object-fit:cover;object-position:50% 8%;display:block} .fc span{display:flex;gap:3px;justify-content:center;align-items:center;font:800 17px/25px var(--ui)} .fc.dear img{filter:saturate(.2) opacity(.75)}
.army{background:#8a241a;color:#fff6e8} .army .n{display:flex;gap:12px;align-items:center;font:800 50px/1 var(--sc)} .army p{margin:5px 0 0;font-size:17px;line-height:1.2} .army button{margin-top:9px;background:#fff3;border-radius:99px;padding:3px 15px;font-weight:800}
.bloom{position:absolute;pointer-events:none} .bloom .lot{position:absolute;width:104px;transform:translate(-50%,-50%) scale(.2);opacity:0;transition:transform .3s,opacity .2s;pointer-events:none;text-align:center} .bloom.on .lot{transform:translate(-50%,-50%);opacity:1;pointer-events:auto} .lot .r{position:relative;width:78px;height:78px;margin:0 auto;border-radius:50%;overflow:hidden;border:4px solid var(--bone);background:#0f3436;box-shadow:0 5px 14px #0008} .lot .r img{width:100%;height:100%;object-fit:cover} .lot .plus{display:grid;place-items:center;height:100%;font:700 38px var(--ui);color:#fff} .lot .tx{display:inline-block;margin-top:-9px;position:relative;background:var(--bone);color:var(--ink);border-radius:99px;padding:2px 11px;font:800 14.500px/1.15 var(--ui);max-width:122px} .lot.ok .r{border-color:var(--ochre);box-shadow:0 0 0 4px var(--ochre),0 5px 14px #0008} .lot.off .r{filter:saturate(.35) brightness(.8)} .lot.off .tx{background:#f7f1e1b8;font-weight:500} .lot.over.ok .r{transform:scale(1.14)} .lot .tk{position:absolute;right:8px;top:-4px} .lot .tx .no{font-size:13px}
.links{position:absolute;overflow:visible;pointer-events:none;opacity:0;transition:opacity .25s} .bloom.on .links{opacity:1}
.bar{position:fixed;left:16px;right:16px;bottom:0;display:flex;align-items:flex-end;justify-content:space-between;z-index:5;pointer-events:none} .bar>*{pointer-events:auto} .card{position:relative;width:108px;height:132px;border-radius:14px 14px 0 0;overflow:hidden;background:var(--bone);color:var(--ink);box-shadow:0 -3px 16px #0009;transition:transform .15s} .hand{display:flex;gap:7px} .card img{width:100%;height:86px;object-fit:cover;object-position:50% 8%;display:block} .card .nm{display:block;font:800 15px/1 var(--sc);padding:6px 8px 0;white-space:nowrap} .card .tr{display:block;font-size:14px;padding:2px 8px;white-space:nowrap} .card:hover{transform:translateY(-7px)} .card.sel{transform:translateY(-14px);box-shadow:0 0 0 4px var(--ochre)} .hand{transition:transform .25s} body.lift .hand{transform:translateY(58px)} body.lift .store,body.lift .hud,body.lift .court{opacity:.0;pointer-events:none;transition:opacity .2s} .card.drag{opacity:.35} .card.swap::after{content:attr(data-tip);position:absolute;inset:auto 0 0;background:var(--ochre);font:800 14px/20px var(--ui);text-align:center}
.store{background:var(--glass);border-radius:16px 16px 0 0;padding:10px 14px 11px;width:300px} .store h4{font-size:15px;font-weight:500;display:flex;justify-content:space-between;margin:0 0 4px} .sl{display:flex;flex-wrap:wrap;gap:3px} .sl i{width:19.5px;height:21px;border-radius:5px;background:#ffffff17;display:grid;place-items:center} .sl i.has{background:#ffffff36} .sl svg{width:17px;height:17px} .store div+h4{margin-top:6px} .right{display:flex;gap:8px;align-items:flex-end;padding-bottom:14px;width:300px;justify-content:flex-end} .right button{background:var(--glass);border-radius:10px;height:40px;min-width:40px;padding:0 13px;text-align:center;font-weight:700} .right .undo{background:var(--ochre);color:var(--ink)} .right .pass{background:var(--scarlet);font:800 18px var(--sc)} .right [hidden]{display:none}
.hud{position:fixed;left:16px;top:12px;display:flex;gap:20px;align-items:center;font-weight:800;font-size:22px;z-index:4;text-shadow:0 2px 5px #000b} .hud .y{font:800 31px/1 var(--sc)} .hud .y small{display:block;font:700 15px/1.2 var(--ui)} .hud span.k{display:flex;gap:6px;align-items:center} .court{position:fixed;right:16px;top:12px;display:flex;gap:12px;z-index:4;font:800 19px var(--sc);text-shadow:0 2px 5px #000b} .court span{display:flex;gap:6px;align-items:center} .red{background:#8a241a;border-radius:99px;padding:3px 15px 3px 9px;text-shadow:none}
.pop{position:fixed;z-index:8;background:#0c2c31f7;border-radius:18px;padding:14px 18px;width:500px;display:none;box-shadow:0 12px 40px #000b;flex-direction:column;gap:10px} body.war .pop{display:flex;left:50%;bottom:18px;transform:translateX(-50%);width:min(820px,94vw)} body.war .bar{display:none} .pop>p{margin:0;font-size:16px;text-align:center}
.note{position:fixed;z-index:5;left:50%;top:14px;transform:translateX(-50%);background:var(--glass);border-radius:14px;padding:8px 18px;display:flex;gap:16px;align-items:center} .note[hidden]{display:none}
</style></head><body>
<div class="map-stage"><div class="map-inner" id="inner"><div class="coast" id="coast"></div><canvas class="terrain"></canvas><svg class="marks"></svg><div class="bloom" id="bloom"></div></div></div>
<div class="hud" id="hud"></div><div class="court" id="court"></div><div class="note" id="note" hidden></div><div class="bar" id="bar"></div><section class="pop" id="war" data-solid></section>
<script src="textures.js"></script><script src="snapshot.js"></script><script src="core.js"></script><script src="panels.js"></script><script src="rich.js"></script><script src="kit.js"></script>
<script>
const $ = (i) => document.getElementById(i), { D, P, t, pick, icon, art, me, at } = Core, K = Kit, S = K.S, L = K.L;
const ANG = [-117, -142, -167, 167, 142, 117], R = 226; let before = null, look = false;
const shore = 'M70 0C40 70 84 120 52 190S92 300 60 380s38 120 8 210 34 130 6 220 30 110 2 190 20 90 12 150H700V0Z';
function coast() {
  const sp = K.spaces(S.card), A = K.army(), spot = (id, top, name, body) => `<div class="spot" style="top:${top}px" data-space="eu:${id}"><h4>${name}<span>${S.card ? K.label(sp[`eu:${id}`]) : ''}</span></h4>${body}${K.tokens(`eu:${id}`)}</div>`;
  $('coast').innerHTML = `<svg viewBox="0 0 470 1150" preserveAspectRatio="none" style="top:-240px;height:1500px"><path d="${shore}" fill="#eef8ee" fill-opacity=".55" transform="translate(-16 0)"/><path d="${shore}" fill="#e6cf95" transform="translate(-6 0)"/><path d="${shore}" fill="#8fae5a"/><path d="M110 0C80 90 130 170 96 260s50 160 12 260 40 200 10 300 30 200 10 330H700V0Z" fill="#7a9c4c"/></svg><div class="city" style="left:60px;top:-14px;width:430px;height:210px;background-image:url(art/europe.webp);background-position:38% 42%"></div><div class="name" style="left:96px;top:108px;color:#fff;text-shadow:0 3px 10px #000">${t('europe')} ${K.away()}</div>` +
    spot('market', 168, t('market'), `<div class="px">${Core.RES.map((r) => `<span>${icon(r, 32)}${D.price[r]}<span class="dm">${D.players.map((_, i) => `<i class="${i < D.demand[r] ? 'on' : ''}"></i>`).join('')}</span></span>`).join('')}</div>`) +
    spot('pier', 306, t('pier'), `<div class="fs">${D.pier.map(([x]) => `<span class="fc${D.agents[x].price > P.gold ? ' dear' : ''}" title="${pick(D.agents[x])}"><img src="${art.agent(x)}" alt=""><span>${icon('gold', 17)}${D.agents[x].price}</span></span>`).join('')}</div>`) +
    spot('salon', 466, t('salon'), `<div class="fs">${D.salon.map((x) => `<span class="fc${D.fathers[x].bells > P.bells ? ' dear' : ''}" title="${pick(D.fathers[x])}"><img src="${art.father(x)}" alt=""><span>${icon('bells', 17)}${D.fathers[x].bells}</span></span>`).join('')}</div>`) +
    `<div class="spot army" style="top:626px"><div class="n">${icon('ref', 44)}${A.ref}</div><p><b>${t('ref')}</b>. ${L(`War now: ${A.pool} against ${A.targets} colonies, ${Math.floor(A.pool / A.targets)}–${Math.ceil(A.pool / A.targets)} each. Loyalist: ${Panels.name(A.loyal)}`, `Война сейчас: ${A.pool} на ${A.targets} колоний, по ${Math.floor(A.pool / A.targets)}–${Math.ceil(A.pool / A.targets)}. Лоялист: ${Panels.name(A.loyal)}`)}</p><button data-war="0">${t('war')}</button></div>`;
}
function bloom() {
  const sp = K.spaces(S.card), [x, y] = at(K.home().cell), cx = x + 32, cy = y + 34, on = (!!S.card || look) && S.war < 0, b = $('bloom');
  b.className = 'bloom'; b.style.left = `${cx}px`; b.style.top = `${cy}px`;
  const pos = ANG.map((a) => [Math.cos(a * Math.PI / 180) * R, Math.sin(a * Math.PI / 180) * R]);
  b.innerHTML = `<svg class="links" width="1" height="1">${pos.map(([a, c]) => `<path d="M${a * 0.5} ${c * 0.5}L${a * 0.78} ${c * 0.78}" stroke="#f7f1e1" stroke-opacity=".75" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/>`).join('')}</svg>` + pos.map(([a, c], i) => { const k = P.buildings[i], lab = S.card ? K.label(sp[`lot:${i}`]) : ''; return `<div class="lot" style="left:${a}px;top:${c}px" data-space="lot:${i}" ${k ? `title="${pick(D.buildings[k])}"` : ''}><div class="r">${k ? `<img src="${art.building(k)}" alt="">` : '<span class="plus">+</span>'}</div><span class="tk">${K.tokens(`lot:${i}`)}</span><span class="tx">${lab || (k ? pick(D.buildings[k]) : t('slot'))}</span></div>`; }).join('');
  // The opening is animated only when it changes.
  requestAnimationFrame(() => b.classList.toggle('on', on)); if (on && bloom.was) b.classList.add('on'); bloom.was = on;
}
function paint() {
  coast(); bloom();
  const sp = K.spaces(S.card), slots = (x, cap) => { const l = Core.RES.flatMap((r) => Array(x[r]).fill(r)); return `<div class="sl">${Array.from({ length: cap }, (_, i) => `<i class="${l[i] ? 'has' : ''}">${l[i] ? icon(l[i], 17) : ''}</i>`).join('')}</div>`; };
  $('hud').innerHTML = `<span class="y">${D.year}<small>${t('round')} ${D.round}/10, ${t('tax').toLowerCase()} ${D.tax}</small></span>${['gold', 'bells', 'crosses'].map((k) => `<span class="k" title="${t(k)}">${icon(k, 25)}${P[k]}</span>`).join('')}<span class="k red" title="${t('ref')}">${icon('ref', 25)}${D.ref}</span>`;
  $('court').innerHTML = D.players.map((p, i) => `<span title="${Panels.name(i)}: ${p.bells} ${t('bells')}, ${p.gold} ${t('gold')}">${K.em(i, 34)}${p.score}</span>`).join('');
  $('bar').innerHTML = `<div class="store"><h4><span>${t('warehouse')}</span><span>${Rich.total(P.wh)}/${D.cap}</span></h4>${slots(P.wh, D.cap)}<h4><span>${t('hold')}</span><span>${Rich.total(P.hold)}/4</span></h4>${slots(P.hold, 4)}</div><div class="hand">${P.hand.map((c) => `<button class="card${S.card === c ? ' sel' : ''}${S.drag === c ? ' drag' : ''}${S.card && sp[`who:${c}`] ? ' swap' : ''}" data-agent="${c}" data-space="who:${c}" data-tip="${L('Exchange', 'Обмен')}"><img src="${art.agent(c)}" alt=""><span class="nm">${pick(D.agents[c])}</span><span class="tr">${Core.eduIcon(D.agents[c].edu)} ${Core.traits(c).join(' ')}</span></button>`).join('')}</div><div class="right"><button class="undo" data-undo ${Rich.history.length ? '' : 'hidden'}>${t('undo')}</button><button data-zoom="1.25">+</button><button data-zoom=".8">−</button><button data-lang>${Core.lang() === 'ru' ? 'EN' : 'RU'}</button><button class="pass" data-pass>${t('pass')}</button></div>`;
  const v = S.look !== null && !S.card ? Core.settlementAt(S.look) : null; $('note').hidden = !v; if (v) $('note').innerHTML = `<b style="font:800 20px var(--sc)">${pick(D.names.tribes[v.tribe])}</b><span>${icon('people', 18)} ${v.pop}</span><span>${t('hostility')} ${v.hostility}</span><span>${t('loot')} ${v.loot.gold ? v.loot.gold + icon('gold', 17) : v.loot.amount + icon(v.loot.res, 17)}</span>`;
  $('war').innerHTML = S.war >= 0 ? `<p>${K.war.head()}</p>${K.war.ledger(S.war)}${K.war.nav(S.war)}` : '';
  camera();
}
/* Back off to show every place an agent can go, then return to where you were. */
function camera() {
  if (!K.stage) return;
  const inner = $('inner'), lifted = !!S.card;
  if (lifted && !before) { before = K.stage.get(); inner.classList.add('ease'); const [x, y] = at(K.home().cell); K.stage.frame(Math.max(0, x - 260), Math.min(y - 240, -20), 1452, Math.max(y + 250, 770), [8, 6, 84, 6]); setTimeout(() => inner.classList.remove('ease'), 450); }
  else if (!lifted && before) { inner.classList.add('ease'); K.stage.set(before); before = null; setTimeout(() => inner.classList.remove('ease'), 450); }
}
K.onCell = (c) => { const own = Core.colonyAt(c)?.owner === me; look = own ? !look : false; };
K.onWar = () => { const x = D.war.sieges[S.war]; $('inner').classList.add('ease'); if (x) K.stage.look(x.cell + Core.W); setTimeout(() => $('inner').classList.remove('ease'), 450); };
K.start({ paint, marks: () => (S.war >= 0 ? { war: (c) => K.war.plate(c, S.war) } : {}), stage: { zoom: 1.42, center: K.home().cell + 3, min: 0.5, max: 2.8 }, map: { europe: false } });
</script></body></html>
