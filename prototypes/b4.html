<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>B4 Triptych</title><link rel="stylesheet" href="kit.css">
<style>
/* B4. A triptych laid out like the real ocean: home in the west, the New World in the middle, Europe in the east. The side wings stay narrow (the map keeps 82%),
   widen when an agent is lifted so that every place shows what it would do, and open fully when you go there. */
:root{--wing:130px;--lift:306px;--wide:62vw}
.map-stage{position:fixed;inset:0}
.wing{position:fixed;top:0;bottom:0;width:var(--wing);z-index:5;transition:width .28s cubic-bezier(.3,.7,.2,1);overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:12px;background-size:cover;box-shadow:0 0 26px #0009} .wing{isolation:isolate} .wing::before{content:"";position:absolute;inset:0;z-index:-1;background:#0c2c31d1;transition:background .28s} .wing>*{position:relative} .west{left:0;background-position:62% 60%} .east{right:0;background-image:url(art/europe.webp);background-position:46% 50%}
body.lift .wing{width:var(--lift)} body.lift .wing::before{background:#0c2c31b8} body[data-view=colony] .west,body[data-view=europe] .east{width:var(--wide)} body[data-view=colony] .west::before{background:linear-gradient(90deg,#0c2c31cc,#0c2c3159)} body[data-view=europe] .east::before{background:linear-gradient(270deg,#0c2c31cc,#0c2c3159)} body[data-view=colony] .east,body[data-view=europe] .west{width:var(--wing)}
.wing>header{display:flex;gap:9px;align-items:center;cursor:pointer;min-height:40px;flex:none} .wing>header h3{font-size:21px;line-height:1;white-space:nowrap} .wing.slim>header h3{font-size:18px} .wing>header .aw{margin-left:auto;text-align:right}
.lots{display:grid;gap:7px;flex:none} .lot{position:relative;display:grid;grid-template-columns:106px 1fr;min-height:58px;border-radius:12px;overflow:hidden;background:#f7f1e11a;align-items:center} .lot img.bg{width:106px;height:58px;object-fit:cover;display:block} .lot .tx{padding:0 12px;line-height:1.15;min-width:0} .lot .tx b{display:block;font:800 17px/1.1 var(--sc)} .slim .lot .tx{display:none} .slim .lot{grid-template-columns:1fr} .slim .lot img.bg{width:100%} .lot .plus{width:106px;height:58px;display:grid;place-items:center;font:700 26px var(--ui);opacity:.55} .lot .tk{position:absolute;left:72px;top:4px;display:flex} .slim .lot .cap{position:absolute;left:0;right:0;bottom:0;background:#0c2c31d9;font:700 13px/1.1 var(--ui);padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .lot .cap{display:none} .slim .lot .cap{display:block}
.lift .west .lots,.lift .west .heap,.lift .east .place,.lift .east .army,.lift .wing>header{width:282px} .lift .east .place,.lift .east .army,.lift .east>header{align-self:flex-end} .lot .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .bl .lot .tx{white-space:normal} .lots .lot{height:58px}
.ok{box-shadow:inset 0 0 0 3px var(--ochre);cursor:copy} .off{opacity:.62} .over.ok{background:var(--bone)!important;color:var(--ink)}
.heap{flex:none} .slim .heap h4{font-size:13.5px} .heap h4{font-size:15.5px;gap:4px;display:flex;justify-content:space-between;margin-bottom:5px;font-weight:500} .sl{display:grid;grid-template-columns:repeat(auto-fill,24px);gap:3px} .sl i{width:24px;height:24px;border-radius:5px;background:#ffffff1a;display:grid;place-items:center} .sl i.has{background:#ffffff36} .sl svg{width:19px;height:19px}
.px{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:1px 6px;font-weight:800;font-size:18px;flex:none} .px span{display:flex;gap:7px;align-items:center} .px .dm{display:flex;gap:2px;align-items:center} .px .dm i{width:7px;height:7px;border-radius:50%;background:#ffffff30} .px .dm i.on{background:var(--bone)}
.place{border-radius:14px;background:#f7f1e11a;padding:9px 11px;flex:none} .place h4{font-size:17px;display:flex;justify-content:space-between;gap:8px;align-items:baseline} .place h4 span{font:700 15px/1.1 var(--ui);text-align:right} .faces{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap} .fc{position:relative;width:49px;border-radius:9px;overflow:hidden;background:var(--bone);color:var(--ink)} .fc img{width:100%;height:56px;object-fit:cover;object-position:50% 8%;display:block} .fc span{display:flex;gap:2px;justify-content:center;align-items:center;font:800 14px/19px var(--ui)} .slim .place{padding:7px 8px} .slim .place h4{font-size:15.5px;font-weight:500} .slim .place h4 span{display:none} .slim .faces{gap:4px} .slim .fc{width:43px} .slim .fc img{height:40px} .slim .salon{display:none} .slim .yard{display:none}
.army{margin-top:auto;cursor:pointer;border-radius:14px;background:#7f2219f2;padding:9px 12px;line-height:1.15;flex:none} .army b.n{font:800 34px/1 var(--sc);display:flex;gap:8px;align-items:center} .army p{margin:3px 0 0;font-size:15px} .slim .army p.more{display:none}
.hudtop{position:fixed;left:50%;top:0;transform:translateX(-50%);display:flex;gap:26px;align-items:center;height:50px;padding:0 24px;background:var(--glass);border-radius:0 0 18px 18px;z-index:4;font-weight:800;font-size:21px;white-space:nowrap} .hudtop .y{font:800 25px var(--sc)} .hudtop .y small{font:500 16px var(--ui)} .hudtop span.k{display:inline-flex;gap:6px;align-items:center} .court{display:flex;gap:12px} .court span{display:flex;gap:6px;align-items:center;font:800 18px var(--sc)}
.tools{position:fixed;left:calc(var(--wing) + 14px);bottom:16px;display:flex;gap:6px;z-index:4} .tools button{background:var(--glass);border-radius:10px;height:38px;min-width:38px;padding:0 13px;text-align:center;font-weight:700} .tools .undo{background:var(--ochre);color:var(--ink)} .tools [hidden]{display:none} .pass{position:fixed;right:calc(var(--wing) + 16px);bottom:16px;z-index:4;background:var(--scarlet);border-radius:14px;font:800 19px var(--sc);padding:9px 24px}
.hand{position:fixed;left:50%;bottom:0;transform:translateX(-50%);display:flex;gap:8px;z-index:6;transition:transform .2s} .card{position:relative;width:112px;height:138px;border-radius:14px 14px 0 0;overflow:hidden;background:var(--bone);color:var(--ink);box-shadow:0 -3px 16px #0009;transition:transform .15s} .card img{width:100%;height:92px;object-fit:cover;object-position:50% 8%;display:block} .card .nm{display:block;font:800 15.5px/1 var(--sc);padding:6px 8px 0;white-space:nowrap} .card .tr{display:block;font-size:14px;padding:2px 8px;white-space:nowrap} .card:hover{transform:translateY(-8px)} .card.sel{transform:translateY(-16px);box-shadow:0 0 0 4px var(--ochre)} .card.off{opacity:1} .card.drag{opacity:.35} body[data-view=colony] .hand,body[data-view=europe] .hand{transform:translate(-50%,82px)} body[data-view=colony] .hand:hover,body[data-view=europe] .hand:hover{transform:translate(-50%,0)} body[data-view=europe] .full{padding-bottom:80px} .card.swap::after{content:attr(data-tip);position:absolute;inset:auto 0 0;background:var(--ochre);font:800 14px/20px var(--ui);text-align:center}
.look{position:fixed;left:50%;top:62px;transform:translateX(-50%);background:var(--glass);border-radius:14px;padding:10px 18px;z-index:4;display:flex;gap:18px;align-items:center} .look[hidden]{display:none}
.full{display:none;gap:22px;flex-direction:column;min-width:0;overflow:auto} body[data-view=colony] .west .full,body[data-view=europe] .east .full{display:flex} body[data-view=colony] .west .slimonly,body[data-view=europe] .east .slimonly{display:none} .full h4{font-size:20px;margin-bottom:8px} .bl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px} .bl .lot{grid-template-columns:1fr;background:var(--bone);color:var(--ink)} .bl .lot img.bg{width:100%;height:112px} .bl .lot .tx{display:block!important;padding:7px 11px 8px} .bl .lot.empty{background:#f7f1e122;color:var(--bone);place-items:center;min-height:152px} .bl .lot .tk{left:8px;top:8px} .ppl{display:flex;gap:11px;flex-wrap:wrap} .big{width:124px;border-radius:13px;overflow:hidden;background:var(--bone);color:var(--ink)} .big img{width:100%;height:122px;object-fit:cover;object-position:50% 8%;display:block} .big b{display:block;font:800 16px/1.05 var(--sc);padding:7px 9px 0} .big span{display:block;font-weight:800;padding:1px 9px 8px} .big.dear img{filter:saturate(.2)} .mkf{display:grid;grid-template-columns:34px 1fr 30px auto;gap:5px 14px;align-items:center;font:800 22px var(--ui);max-width:520px} .mkf .b{height:11px;border-radius:9px;background:#ffffff26;overflow:hidden} .mkf .b i{display:block;height:100%;background:var(--ochre)} .mkf .dm{display:flex;gap:4px} .mkf .dm i{width:12px;height:12px;border-radius:50%;background:#ffffff30} .mkf .dm i.on{background:var(--bone)}
.warbar{position:fixed;left:calc(var(--wing) + 22px);right:calc(var(--wing) + 22px);bottom:14px;z-index:8;background:#0c2c31f7;border-radius:18px;padding:13px 20px 12px;display:none;flex-direction:column;gap:10px} body.war .warbar{display:flex} body.war .hand,body.war .tools,body.war .pass{display:none} .warbar>p{margin:0;font-size:16px;text-align:center}
</style></head><body>
<div class="map-stage"><div class="map-inner"><canvas class="terrain"></canvas><svg class="marks"></svg></div></div>
<div class="hudtop" id="top" data-solid></div><div class="look" id="look" hidden data-solid></div>
<aside class="wing west" id="west" data-solid></aside><aside class="wing east" id="east" data-solid></aside>
<div class="tools" id="tools"></div><button class="pass" data-pass id="pass"></button><div class="hand" id="hand"></div><section class="warbar" id="war" data-solid></section>
<script src="textures.js"></script><script src="snapshot.js"></script><script src="core.js"></script><script src="panels.js"></script><script src="rich.js"></script><script src="kit.js"></script>
<script>
const $ = (i) => document.getElementById(i), { D, P, t, pick, icon, art, me } = Core, K = Kit, S = K.S, L = K.L;
const lot = (sp) => Array.from({ length: 6 }, (_, i) => { const b = P.buildings[i]; return `<div class="lot${b ? '' : ' empty'}" data-space="lot:${i}">${b ? `<img class="bg" src="${art.building(b)}" alt=""><span class="cap">${pick(D.buildings[b])}</span>` : '<span class="plus">+</span>'}<div class="tx"><b>${b ? pick(D.buildings[b]) : t('slot')}</b>${S.card ? K.label(sp[`lot:${i}`]) : b ? Panels.work(b) : ''}</div><span class="tk">${K.tokens(`lot:${i}`)}</span></div>`; }).join('');
const slots = (x, cap) => { const l = Core.RES.flatMap((r) => Array(x[r]).fill(r)); return `<div class="sl">${Array.from({ length: cap }, (_, i) => `<i class="${l[i] ? 'has' : ''}">${l[i] ? icon(l[i], 19) : ''}</i>`).join('')}</div>`; };
const dm = (r) => `<span class="dm">${D.players.map((_, i) => `<i class="${i < D.demand[r] ? 'on' : ''}"></i>`).join('')}</span>`;
function paint() {
  const sp = K.spaces(S.card), A = K.army(), slimW = !S.card && S.view !== 'colony', slimE = !S.card && S.view !== 'europe', home = K.home();
  $('top').innerHTML = `<span class="y">${D.year} <small>${t('round')} ${D.round}/10, ${t('tax').toLowerCase()} ${D.tax}</small></span>${['gold', 'bells', 'crosses'].map((k) => `<span class="k" title="${t(k)}">${icon(k, 23)}${P[k]}</span>`).join('')}<span class="court">${D.players.map((p, i) => `<span title="${Panels.name(i)}: ${p.bells} ${t('bells')}">${K.em(i, 30)}${p.score}</span>`).join('')}</span>`;
  $('west').className = `wing west${slimW ? ' slim' : ''}`; $('west').style.backgroundImage = `url(${art.nation(P.nation)})`;
  $('west').innerHTML = `<header data-go="colony">${K.em(me, 38)}<h3>${slimW ? t('colony') : pick(D.names.nations[P.nation])}</h3></header><div class="slimonly" style="display:${S.view === 'colony' ? 'none' : 'contents'}"><div class="lots">${lot(sp)}</div></div><div class="full"><div class="bl">${lot(sp)}</div><div><h4>${t('fathers')}</h4><div class="ppl">${P.fathers.map((f) => `<div class="big"><img src="${art.father(f)}" alt=""><b>${pick(D.fathers[f])}</b><span></span></div>`).join('')}</div></div></div><div class="heap" style="margin-top:auto"><h4><span>${t('warehouse')}</span><span>${Rich.total(P.wh)}/${D.cap}</span></h4>${slots(P.wh, D.cap)}</div><div class="heap"><h4><span>${t('hold')}</span><span>${Rich.total(P.hold)}/4</span></h4>${slots(P.hold, 4)}</div>`;
  const place = (id, name, body, cls = '') => `<div class="place ${cls}" data-space="eu:${id}"><h4>${name}<span>${S.card ? K.label(sp[`eu:${id}`]) : ''}</span></h4>${body}${K.tokens(`eu:${id}`)}</div>`;
  const faces = (l, f, c, k) => `<div class="faces">${l.map((x) => `<span class="fc"><img src="${f(x)}" alt="" title="${k(x)}"><span>${c(x)}</span></span>`).join('')}</div>`;
  $('east').className = `wing east${slimE ? ' slim' : ''}`;
  $('east').innerHTML = `<header data-go="europe"><h3>${t('europe')}</h3>${K.away()}</header><div class="slimonly" style="display:${S.view === 'europe' ? 'none' : 'contents'}">${place('market', t('market'), `<div class="px">${Core.RES.map((r) => `<span>${icon(r, 22)}${D.price[r]}</span>${dm(r)}`).join('')}</div>`)}${place('pier', t('pier'), faces(D.pier.slice(0, slimE ? 4 : 5), (x) => art.agent(x[0]), (x) => `${icon('gold', 14)}${D.agents[x[0]].price}`, (x) => pick(D.agents[x[0]])))}${place('salon', t('salon'), faces(D.salon, (x) => art.father(x), (x) => `${icon('bells', 14)}${D.fathers[x].bells}`, (x) => pick(D.fathers[x])), 'salon')}${place('yard', L('Shipyard', 'Верфь'), '', 'yard')}</div><div class="full"><div data-space="eu:market" class="place"><h4>${t('market')}<span>${S.card ? K.label(sp['eu:market']) : `${t('hold')}: ${K.cargo()} ${icon('gold', 18)}`}</span></h4><div class="mkf">${Core.RES.map((r) => `${icon(r, 28)}<span class="b"><i style="width:${D.price[r] * 20}%"></i></span>${D.price[r]}${dm(r)}`).join('')}</div></div><div data-space="eu:pier" class="place"><h4>${t('pier')}<span>${S.card ? K.label(sp['eu:pier']) : ''}</span></h4><div class="ppl">${D.pier.map(([x]) => `<div class="big${D.agents[x].price > P.gold ? ' dear' : ''}"><img src="${art.agent(x)}" alt=""><b>${pick(D.agents[x])}</b><span>${icon('gold', 18)} ${D.agents[x].price}</span></div>`).join('')}</div></div><div data-space="eu:salon" class="place"><h4>${t('salon')}<span>${S.card ? K.label(sp['eu:salon']) : ''}</span></h4><div class="ppl">${D.salon.map((x) => `<div class="big${D.fathers[x].bells > P.bells ? ' dear' : ''}"><img src="${art.father(x)}" alt=""><b>${pick(D.fathers[x])}</b><span>${icon('bells', 18)} ${D.fathers[x].bells}</span></div>`).join('')}</div></div></div><div class="army" data-war="0" title="${t('war')}"><b class="n">${icon('ref', 28)}${A.ref}</b><p>${t('ref')}</p><p class="more">${L(`If the war came now: ${A.pool} against ${A.targets} colonies, ${Math.floor(A.pool / A.targets)}–${Math.ceil(A.pool / A.targets)} each`, `Если бы война началась сейчас: ${A.pool} на ${A.targets} колоний, по ${Math.floor(A.pool / A.targets)}–${Math.ceil(A.pool / A.targets)}`)}. ${t('loyalist')}: ${Panels.name(A.loyal)}</p></div>`;
  $('tools').innerHTML = `<button data-zoom="1.25">+</button><button data-zoom=".8">−</button><button data-lang>${Core.lang() === 'ru' ? 'EN' : 'RU'}</button><button class="undo" data-undo ${Rich.history.length ? '' : 'hidden'}>${t('undo')}</button>`;
  $('pass').textContent = t('pass');
  $('hand').innerHTML = P.hand.map((c) => `<button class="card${S.card === c ? ' sel' : ''}${S.drag === c ? ' drag' : ''}${S.card && sp[`who:${c}`] ? ' swap' : ''}" data-agent="${c}" data-space="who:${c}" data-tip="${L('Exchange', 'Обмен')}"><img src="${art.agent(c)}" alt=""><span class="nm">${pick(D.agents[c])}</span><span class="tr">${Core.eduIcon(D.agents[c].edu)} ${Core.traits(c).join(' ')}</span></button>`).join('');
  const v = S.look !== null && !S.card ? Core.settlementAt(S.look) : null;
  $('look').hidden = !v; if (v) $('look').innerHTML = `<b style="font:800 20px var(--sc)">${pick(D.names.tribes[v.tribe])}</b><span>${icon('people', 18)} ${v.pop}</span><span>${t('hostility')} ${v.hostility}</span><span>${t('loot')} ${v.loot.gold ? v.loot.gold + icon('gold', 17) : v.loot.amount + icon(v.loot.res, 17)}</span><span class="dim">${v.hostility >= 4 ? t('raid') : v.hostility === 3 ? t('calm') : t('gift')}</span>`;
  $('war').innerHTML = S.war >= 0 ? `<p>${K.war.head()}</p>${K.war.ledger(S.war)}${K.war.nav(S.war)}` : '';
}
K.onCell = (c) => { const col = Core.colonyAt(c); if (col?.owner === me) S.view = 'colony'; if (D.zone[c] === 'europe') S.view = 'europe'; };
K.onWar = () => { const x = D.war.sieges[S.war]; if (x) K.stage.look(x.cell + Core.W * 2); };
K.start({ paint, marks: () => (S.war >= 0 ? { war: (c) => K.war.plate(c, S.war) } : {}), stage: { zoom: 1.28, center: K.home().cell + 2, min: 0.55, max: 2.6 } });
</script></body></html>
