<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sea Chart direction</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Sofia+Sans+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Sea chart. The map is the whole screen, drawn like a hydrographic survey. Magenta, the chart-maker's overprint colour, marks everything you can act on and nothing else.
   Agents sit as index tabs along the left edge; a single sheet slides in from the right. */
:root { --sea:#ecf4f4; --shoal:#bcdde3; --land:#efe0aa; --ink:#28343c; --soft:#5d6f78; --over:#b0126b; --paper:#fbfcfa; --rule:#b9c8cc;
  --chart:"Old Standard TT", "Times New Roman", serif; --ui:"Sofia Sans Condensed", "Arial Narrow", sans-serif; }
*{box-sizing:border-box} html,body{height:100%;margin:0} body{background:var(--sea);color:var(--ink);font:500 16px/1.3 var(--ui);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left} :focus-visible{outline:2px solid var(--over);outline-offset:2px}
h2,h3,h4{font-family:var(--chart);font-weight:700;margin:0} .dim,.lbl{color:var(--soft)} .ic{vertical-align:-.22em;flex:none}
.map-stage{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none} .map-inner{position:absolute;transform-origin:0 0;width:1024px;height:1024px;box-shadow:0 0 0 1.500px var(--ink),0 0 0 9px var(--paper),0 0 0 10.500px var(--ink)} .map-inner>*{position:absolute;inset:0;width:100%;height:100%}
.title{position:fixed;left:24px;top:20px;width:284px;background:var(--paper);border:1.500px solid var(--ink);padding:14px 16px 12px;text-align:center}
.title h1{font:400 27px/1.05 var(--chart);margin:0 0 4px} .title p{margin:0;font:italic 17px/1.3 var(--chart)} .title .taxes{margin-top:10px}
.taxes{display:flex;border-top:1px solid var(--rule)} .taxes i{flex:1;font-style:normal;font-size:14px;padding-top:3px;color:var(--soft);font-variant-numeric:tabular-nums} .taxes small{display:block;font-size:11px;opacity:.75} .taxes .on{color:var(--paper);background:var(--over);font-weight:700} .taxes .past{opacity:.45}
.stats{display:flex;justify-content:space-between;border-top:1px solid var(--rule);margin-top:8px;padding-top:9px} .stat{display:flex;gap:6px;align-items:center;font-size:19px} .stat .lbl{display:none}
.hand{position:fixed;left:24px;top:236px;width:284px;display:flex;flex-direction:column;gap:5px}
.card{display:grid;grid-template-columns:46px 1fr;grid-template-rows:auto auto;column-gap:11px;background:var(--paper);border:1px solid var(--rule);padding:0 10px 0 0;align-items:center;min-height:50px;transition:transform .16s} .card img{grid-row:1/3;width:46px;height:50px;object-fit:cover;object-position:50% 18%} .card .nm{font:700 17px/1 var(--chart);align-self:end} .card .tr{font-size:14px;color:var(--soft);align-self:start}
.card.sel{border:2px solid var(--over);transform:translateX(16px)} .card:hover{border-color:var(--over)}
.pass{align-self:flex-start;margin-top:5px;padding:6px 14px;border:1px solid var(--rule);background:var(--paper)} .decks{font-size:14px;color:var(--soft);margin-top:2px}
.acts{position:fixed;left:338px;top:236px;width:268px;max-height:calc(100vh - 262px);overflow:auto;background:var(--paper);border:1.500px solid var(--over);padding:6px 14px 12px}
.acts[hidden]{display:none} .grp h4{font:italic 400 16px/1.2 var(--chart);color:var(--soft);margin:9px 0 2px} .act{display:flex;width:100%;gap:8px;align-items:baseline;justify-content:space-between;padding:4px 0;font-weight:600;font-size:17px;border-bottom:1px solid #edf1f0} .act:not(.off):hover,.act.sel{color:var(--over)} .act.off{color:#93a1a6;font-weight:500;cursor:default} .act small{font-size:13.500px;font-weight:500} .act .why{text-align:right;max-width:58%;line-height:1.1}
.opts{display:flex;flex-direction:column;padding:2px 0 6px 12px;border-left:2px solid var(--over)} .opt{padding:3px 8px} .opt:hover{background:#fbe9f3}
.sheet{position:fixed;right:24px;top:20px;bottom:20px;width:386px;background:var(--paper);border:1.500px solid var(--ink);padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:13px} .sheet h2{font-size:29px;line-height:1} .sheet h4{font-size:18px;border-bottom:1px solid var(--ink);padding-bottom:2px;margin-bottom:7px}
.tabs{display:flex;gap:16px;font:italic 18px var(--chart);border-bottom:1.500px solid var(--ink);padding-bottom:7px} .tabs button[aria-current=true]{color:var(--over);font-weight:700}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border:1px solid var(--ink)} .cl{height:66px;background:var(--land);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px 8px;padding:3px} .t-ocean{background:var(--shoal)} .t-forest{background:#cfd89e} .t-mountains{background:#dfc48e} .t-desert{background:#f6eac4} .t-tundra{background:#e2e3d0} .t-closed{background:#fff} .cl.here{box-shadow:inset 0 0 0 2px var(--over)} .cl img{width:20px;height:20px;filter:brightness(0) saturate(0) opacity(.75)} .y{display:inline-flex;align-items:center;gap:2px;font-weight:700}
.meta{margin:4px 0 0} .slots{display:flex;flex-wrap:wrap;gap:4px} .slot{width:34px;height:34px;border:1px solid var(--rule);display:grid;place-items:center} .slot.has{border-color:var(--ink)}
.blds{display:grid;grid-template-columns:1fr 1fr;gap:6px} .bld{margin:0;display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;border:1px solid var(--rule);min-height:50px} .bld img{width:52px;height:50px;object-fit:cover} .bld figcaption{font-weight:600;line-height:1.1} .bld small{display:block;font-weight:500;color:var(--soft)} .bld.empty{display:grid;grid-template-columns:1fr;place-items:center;border-style:dashed;color:#93a1a6}
.row{display:flex;flex-direction:column;gap:4px} .mini{display:grid;grid-template-columns:44px 1fr auto;column-gap:10px;align-items:center;border:1px solid var(--rule);min-height:44px;padding-right:10px} .mini img{grid-row:1/3;width:44px;height:46px;object-fit:cover;object-position:50% 20%} .mini .nm{font:700 16px/1.1 var(--chart)} .mini .tr{grid-column:2;font-size:14px;color:var(--soft)} .mini .cost{grid-column:3;grid-row:1/3;font-weight:700;font-size:18px;display:flex;gap:4px;align-items:center} .mini.dear{opacity:.5} .mini.father .nm{grid-row:1/3} .mini.empty{border-style:dashed;color:#93a1a6;padding-left:10px;grid-template-columns:1fr} button.mini:not(.dear):hover{border-color:var(--over)}
.mkt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums} .mkt th{text-align:left;font-weight:600;padding:4px 0} .mkt .pr i{display:inline-block;width:24px;text-align:center;font-style:normal;color:#b3bfc3} .mkt .pr .lo{color:var(--soft)} .mkt .pr .on{background:var(--over);color:#fff;font-weight:700} .pip{display:inline-block;width:9px;height:9px;border:1px solid var(--ink);border-radius:50%;margin-left:2px} .pip.on{background:var(--ink)} .pip.bad.on{background:#c8442f;border-color:#c8442f} .pip.mid.on{background:#c98f2a;border-color:#c98f2a} .pip.ok.on{background:#4c8a57;border-color:#4c8a57}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;font-size:15px} .plan{display:flex;justify-content:space-between;border-bottom:1px solid #edf1f0;padding:2px 0} .plan img{display:none} .plan.gone{opacity:.35;text-decoration:line-through} .plan.own{color:var(--over)}
.native{display:grid;grid-template-columns:122px 1fr;gap:14px} .native img{width:122px;height:170px;object-fit:cover} dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:6px 0 0} dt{color:var(--soft)} dd{margin:0}
.riv{display:grid;grid-template-columns:26px 1fr auto auto auto 34px;gap:9px;align-items:center;padding:4px 0;border-bottom:1px solid #edf1f0;font-variant-numeric:tabular-nums} .em{width:26px;height:26px;background:var(--c);display:grid;place-items:center} .em img{width:18px} .riv .sc{text-align:right;font:700 21px var(--chart)} .riv .v{display:flex;gap:3px;align-items:center} .riv.me .nm{font-weight:700}
.log{list-style:none;margin:0;padding:0;font-size:15px;line-height:1.35;color:var(--soft)} .log b{color:var(--c)} .log em{font-family:var(--chart);color:var(--ink);font-size:17px}
.tools{position:fixed;left:338px;top:20px;display:flex;gap:6px} .tools button{background:var(--paper);border:1px solid var(--rule);min-width:38px;height:36px;padding:0 10px;text-align:center}
.warview{position:fixed;inset:0;background:var(--paper);overflow:auto;padding:34px clamp(24px,6vw,96px) 60px;display:none} body[data-view=war] .warview{display:block} .warhead{display:flex;justify-content:space-between;align-items:baseline;gap:24px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:18px} .warhead h2{font-size:38px} .sieges{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px 26px} .siege header{display:flex;gap:10px;align-items:center} .siege header h3{flex:1;font-size:20px} .force{display:grid;grid-template-columns:38px 1fr;align-items:center;margin-top:5px} .force>b{font:700 25px var(--chart)} .parts{display:flex;height:30px;font-size:13px;gap:1px} .parts span{background:var(--shoal);padding:6px 5px 0;overflow:hidden;white-space:nowrap;min-width:0} .parts em{font-style:normal;font-weight:700} .atk .parts span{background:#efc3bb} .siege footer{display:flex;gap:12px;align-items:center;margin-top:7px;border-top:1px solid var(--rule);padding-top:6px} .dice{display:flex;gap:2px} .dice i{font-style:normal;width:20px;height:20px;border:1px solid var(--rule);text-align:center;line-height:18px;font-size:14px} .dice .hit{background:#c8442f;color:#fff;border-color:#c8442f} .odds{flex:1;color:var(--soft)} .out{font:700 18px var(--chart)} .siege.fell .out{color:#b3341f} .siege:not(.fell) .out{color:#3c7a48} .final{margin-top:28px;max-width:780px} .final .riv{grid-template-columns:26px 190px 1fr 40px} .bits{color:var(--soft)} .x{position:absolute;right:24px;top:20px;font:italic 19px var(--chart);border-bottom:1px solid}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,60px);background:var(--ink);color:#fff;padding:9px 18px;transition:transform .2s} .toast.on{transform:translate(-50%,0)}
@media(max-width:1180px){.sheet{width:320px}.acts{left:322px;width:236px}.hand,.title{width:264px}.tools{left:322px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="map-stage"><div class="map-inner"><canvas class="terrain"></canvas><svg class="marks"></svg></div></div>
<div class="title" id="title"></div><div class="tools" id="tools"></div><div class="hand" id="hand"></div><div class="acts" id="acts" hidden></div><aside class="sheet" id="sheet"></aside><div class="warview" id="war"></div>
<script src="../textures.js"></script><script src="../snapshot.js"></script><script src="../core.js"></script><script src="../panels.js"></script>
<script>
const $ = (i) => document.getElementById(i), { D, P, t, pick } = Core;
let tab = 'colony';
document.addEventListener('click', (e) => { const x = e.target.closest('[data-tab]'); if (x) { tab = x.dataset.tab; Panels.S.sel = null; Panels.paint(); } });
Panels.S.onCell = (c) => { if (Core.settlementAt(c) || !Core.colonyAt(c)) tab = 'place'; if (Core.colonyAt(c)) tab = 'colony'; if (D.zone[c] === 'europe') tab = 'europe'; };
Panels.start({ skin: 'chart', zoom: 1.08, center: Panels.S.focus.cell + 1, render(S) {
  $('title').innerHTML = `<h1>${pick(D.names.nations[P.nation])}</h1><p>A.D. ${D.year}, ${t('round').toLowerCase()} ${D.round} ${t('of')} 10</p><div class="stats">${Panels.stats()}<span class="stat">${Core.icon('ref', 22)}<b>${D.ref}</b></span></div>${Panels.tax()}`;
  $('tools').innerHTML = `<button data-zoom="1.25">+</button><button data-zoom=".8">−</button><button data-view="war">${t('warshort')}</button><button data-lang>${Core.lang() === 'ru' ? 'English' : 'Русский'}</button>`;
  $('hand').innerHTML = P.hand.map((c) => Panels.card(c, S.card === c ? 'sel' : '')).join('') + `<button class="pass">${t('pass')}</button><div class="decks">${P.deck} ${t('deck')}, ${P.discard.length} ${t('discard')}</div>`;
  $('acts').hidden = !S.card; $('acts').innerHTML = Panels.actions(S.card, S.action);
  const st = S.sel !== null && Core.settlementAt(S.sel);
  $('sheet').innerHTML = `<nav class="tabs">${[['colony', t('colony')], ['europe', t('europe')], ['rivals', t('rivals')], ...(S.sel !== null ? [['place', t('map')]] : [])].map(([k, n]) => `<button data-tab="${k}" aria-current="${tab === k}">${n}</button>`).join('')}</nav>` + ({
    colony: () => `<div><h2>${Panels.name(S.focus.owner)}</h2></div>${Panels.colony(S.focus, S.card || P.hand[0])}<div><h4>${t('warehouse')}</h4>${Panels.warehouse()}</div><div><h4>${t('hold')}</h4>${Panels.hold()}</div><div><h4>${t('buildings')}</h4>${Panels.buildings()}</div><div><h4>${t('fathers')}</h4>${Panels.fathers()}</div>`,
    europe: () => `<h2>${t('europe')}</h2><div><h4>${t('market')}</h4>${Panels.market()}</div><div><h4>${t('pier')}</h4>${Panels.pier()}</div><div><h4>${t('salon')}</h4>${Panels.salon()}</div><div><h4>${t('plans')}</h4>${Panels.plans()}</div>`,
    rivals: () => `<h2>${t('rivals')}</h2><div>${Panels.rivals()}</div><div><h4>${t('log')}</h4><ul class="log">${Panels.log()}</ul></div>`,
    place: () => (st ? Panels.native(st) : S.sel !== null ? Panels.cell(S.sel) : ''),
  })[tab]();
  $('war').innerHTML = `<button class="x" data-close>${t('back')}</button>` + Panels.war();
} });
</script></body></html>
