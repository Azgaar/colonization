<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Governor's Table direction</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap">
<style>
/* Governor's table. Everything is on the table at once: your colony board left, the map centre, Europe right, hand below. It speaks the language of the printed cards
   (charcoal name bars, flat illustration, nation colour), so what you test here looks like what you will print. Built for the designer: numbers are never hidden. */
:root { --felt:#d9dfe0; --char:#3c3f42; --char2:#54585c; --white:#fff; --ink:#22262a; --soft:#68707a; --line:#c3cacc; --nation:#233e8b; --green:#d6f0cf; --ui:"Exo 2", "Segoe UI", sans-serif; }
*{box-sizing:border-box} html,body{height:100%;margin:0} body{background:var(--felt);color:var(--ink);font:500 14px/1.3 var(--ui);display:grid;grid-template:46px minmax(0,1fr) 206px / 318px minmax(0,1fr) 372px;gap:8px;padding:8px;overflow:hidden} button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left} :focus-visible{outline:3px solid var(--nation);outline-offset:1px} h2,h3,h4{margin:0;font-weight:700} .ic{vertical-align:-.22em;flex:none} .dim{color:var(--soft)}
.bar{grid-column:1/4;background:var(--nation);color:#fff;border-radius:6px;display:flex;align-items:center;gap:20px;padding:0 14px} .bar h1{font-size:19px;font-weight:800;margin:0;display:flex;gap:10px;align-items:center} .bar h1 img{width:26px} .stats{display:flex;gap:16px} .stat{display:flex;gap:5px;align-items:center;font-size:17px;font-weight:700} .stat .lbl{font-size:13px;font-weight:500;opacity:.8} .taxes{display:flex;margin-left:auto;gap:2px} .taxes i{font-style:normal;background:#ffffff24;width:33px;text-align:center;border-radius:4px;line-height:1.05;padding:3px 0;font-weight:700;font-size:13px} .taxes small{display:block;font-size:10px;font-weight:500;opacity:.8} .taxes .on{background:#fff;color:var(--nation)} .taxes .past{opacity:.5} .tools{display:flex;gap:5px} .tools button{background:#ffffff2b;border-radius:4px;padding:4px 10px;font-weight:600}
.col{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px} .box{background:var(--white);border-radius:6px;overflow:hidden;flex:none} .box>h4{background:var(--char);color:#fff;font-size:13.500px;padding:5px 10px;display:flex;justify-content:space-between} .box>div{padding:8px}
.board{position:relative;background-size:cover;background-position:50%} .board .blds{padding:0} .blds{display:grid;grid-template-columns:repeat(3,1fr);gap:5px} .bld{margin:0;position:relative;border-radius:4px;overflow:hidden;background:var(--char);color:#fff;height:84px} .bld img{width:100%;height:52px;object-fit:cover;display:block} .bld figcaption{font-weight:700;font-size:11.500px;line-height:1.1;padding:3px 5px;display:flex;flex-direction:column} .bld small{font-weight:500;font-size:11.500px} .bld.empty{background:#ffffff8c;border:1.500px dashed var(--char2);color:var(--char2);display:grid;place-items:center;font-size:11.500px}
.slots{display:flex;flex-wrap:wrap;gap:4px} .slot{width:31px;height:31px;border-radius:4px;background:#eef1f1;border:1px solid var(--line);display:grid;place-items:center}
.map{position:relative;border-radius:6px;overflow:hidden;background:#1d2a33} .map-stage{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none} .map-inner{position:absolute;transform-origin:0 0;width:1024px;height:1024px} .map-inner>*{position:absolute;inset:0;width:100%;height:100%} .info{position:absolute;left:8px;bottom:8px;width:310px;background:#fffffff2;border-radius:6px;padding:10px 12px} .info[hidden]{display:none} .native{display:grid;grid-template-columns:92px 1fr;gap:10px} .native img{width:92px;height:140px;object-fit:cover;border-radius:4px} dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:4px 0 0;font-size:13px} dt{color:var(--soft)} dd{margin:0}
.pip{display:inline-block;width:10px;height:10px;border-radius:2px;background:#dfe5e6;margin-right:2px} .pip.on{background:var(--char)} .pip.bad.on{background:#c0392b} .pip.mid.on{background:#d1962a} .pip.ok.on{background:#4c8a57}
.mkt{width:100%;border-collapse:separate;border-spacing:0 2px} .mkt th{text-align:left;font-weight:600;font-size:13px} .mkt .pr i{display:inline-block;width:26px;height:25px;line-height:25px;text-align:center;font-style:normal;background:#f1f4f4;border-radius:4px;margin-right:2px;color:var(--soft)} .mkt .pr .on{background:var(--green);color:var(--ink);font-weight:800;box-shadow:inset 0 0 0 2px #5da24e}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px} .mini{position:relative;border-radius:4px;overflow:hidden;background:var(--char);color:#fff;display:flex;flex-direction:column} .mini img{width:100%;height:66px;object-fit:cover;object-position:50% 14%;order:2} .mini .nm{order:1;font-weight:700;font-size:10.500px;line-height:1.1;padding:3px 4px;min-height:27px;display:grid;place-items:center;text-align:center} .mini .tr{order:3;font-size:10.500px;padding:2px 3px;text-align:center;min-height:20px;white-space:nowrap;overflow:hidden} .mini .cost{position:absolute;right:3px;top:31px;background:#fff;color:var(--ink);border-radius:4px;padding:0 5px 0 2px;font-weight:800;font-size:13px} .mini.dear{opacity:.45} .mini.empty{background:#eef1f1;color:var(--soft);min-height:60px;border:1.500px dashed var(--line);justify-content:center} button.mini:not(.dear):hover{box-shadow:0 0 0 2px var(--nation)} .four .row{grid-template-columns:repeat(4,1fr)}
.plans{display:grid;grid-template-columns:repeat(7,1fr);gap:4px} .plan{background:var(--char);color:#fff;border-radius:4px;overflow:hidden;font-size:9.500px;line-height:1.1;text-align:center;font-weight:600} .plan img{width:100%;height:34px;object-fit:cover;display:block} .plan span{display:block;padding:2px 1px;min-height:23px} .plan small{display:block;font-size:10px;padding-bottom:2px} .plan.gone{opacity:.3} .plan.own{box-shadow:0 0 0 2px var(--nation)}
.hand{grid-column:1/4;display:flex;gap:8px;min-height:0} .cards{display:flex;gap:6px} .card{position:relative;width:124px;border-radius:6px;overflow:hidden;background:var(--char);color:#fff;display:flex;flex-direction:column} .card .nm{order:1;font-weight:800;font-size:13.500px;text-align:center;padding:6px 4px 4px} .card img{order:2;flex:1;min-height:0;width:100%;object-fit:cover;object-position:50% 10%} .card .tr{order:3;font-size:12.500px;padding:4px;text-align:center;min-height:28px;white-space:nowrap} .card.sel{box-shadow:0 0 0 4px var(--nation)} .side{display:flex;flex-direction:column;gap:6px;width:96px} .side button,.side span{flex:1;background:#fff;border-radius:6px;display:grid;place-items:center;font-weight:700;text-align:center} .side .pass{background:var(--char);color:#fff;font-size:17px}
.acts{flex:1;background:#fff;border-radius:6px;overflow:auto;padding:6px 12px;min-width:0} .acts .in{columns:210px 5;column-gap:18px} .grp{break-inside:avoid;margin-bottom:5px} .grp h4{font-size:12px;color:var(--soft)} .act{display:flex;width:100%;gap:8px;justify-content:space-between;align-items:baseline;font-weight:700;padding:1.500px 6px;border-radius:4px;line-height:1.25} .act:not(.off):hover{background:var(--green)} .act.sel{background:var(--nation);color:#fff} .act.off{color:#9aa3a9;font-weight:500;cursor:default} .act .why{font-size:11.500px;text-align:right} .opts{display:flex;flex-wrap:wrap;gap:3px;padding:3px 0 4px} .opt{background:var(--green);border-radius:4px;padding:2px 7px;font-size:13px} .opt:hover{box-shadow:0 0 0 2px #5da24e} .hint{color:var(--soft);font-size:16px}
.riv{display:grid;grid-template-columns:22px 1fr 38px 42px 38px 30px;gap:6px;align-items:center;padding:3px 0;font-variant-numeric:tabular-nums} .em{width:22px;height:22px;border-radius:4px;background:var(--c);display:grid;place-items:center} .em img{width:15px} .riv .v{display:flex;gap:2px;align-items:center;font-weight:600} .riv .sc{text-align:right;font-size:17px;font-weight:800} .riv.me{font-weight:700} .riv .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .log{list-style:none;margin:0;padding:0;font-size:12.500px;line-height:1.45;color:var(--soft)} .log b{color:var(--c)} .log em{font-style:normal;font-weight:700;color:var(--ink)}
.cells{display:grid;grid-template-columns:repeat(3,1fr);gap:3px} .cl{height:52px;border-radius:4px;background:#b4cf73;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1px 6px} .t-ocean{background:#8bbbd8} .t-forest{background:#8aa96c} .t-mountains{background:#bcbbb5} .t-desert{background:#e8d5a0} .t-tundra{background:#d4dcd9} .cl.here{box-shadow:inset 0 0 0 3px var(--nation)} .cl img{width:18px;filter:brightness(.25)} .y{display:inline-flex;gap:1px;align-items:center;font-weight:800;font-size:13px} .meta{margin:5px 0 0}
.over{position:fixed;inset:0;background:var(--felt);display:none;overflow:auto;padding:18px 24px} body[data-view=war] .over{display:block} .warhead{background:var(--char);color:#fff;border-radius:6px;padding:10px 18px;display:flex;gap:24px;align-items:center;margin-bottom:12px} .warhead h2{font-size:22px} .warhead p{margin:0;font-size:16px} .sieges{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px} .siege{background:#fff;border-radius:6px;overflow:hidden} .siege header{background:var(--c);color:#fff;display:flex;gap:8px;align-items:center;padding:6px 10px} .siege h3{flex:1;font-size:15px} .force{display:grid;grid-template-columns:38px 1fr;align-items:center;padding:4px 10px 0} .force>b{font-size:21px;font-weight:800} .parts{display:flex;min-width:0;gap:2px;height:27px;font-size:11.500px} .parts span{background:#cfe0f0;padding:6px 5px;border-radius:3px;overflow:hidden;white-space:nowrap;min-width:0} .parts em{font-style:normal;font-weight:800} .atk .parts span{background:#f0c4bd} .siege footer{display:flex;gap:10px;align-items:center;padding:8px 10px} .dice{display:flex;gap:2px} .dice i{font-style:normal;width:19px;height:19px;line-height:19px;text-align:center;background:#eef1f1;border-radius:3px;font-weight:700;font-size:12px} .dice .hit{background:#c0392b;color:#fff} .odds{flex:1;color:var(--soft);font-size:12.500px} .out{font-size:16px;font-weight:800} .siege.fell .out{color:#c0392b} .siege:not(.fell) .out{color:#3c7a48} .final{background:#fff;border-radius:6px;padding:12px 16px;margin-top:12px;max-width:820px} .final .riv{grid-template-columns:26px 190px 1fr 40px} .bits{color:var(--soft)} .x{position:fixed;right:34px;top:27px;background:#fff;border-radius:4px;padding:6px 16px;font-weight:700;z-index:2}
.toast{position:fixed;left:50%;bottom:228px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;border-radius:6px;padding:8px 18px;font-weight:600;transition:.18s;pointer-events:none} .toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header class="bar" id="bar"></header><div class="col" id="left"></div>
<main class="map"><div class="map-stage"><div class="map-inner"><canvas class="terrain"></canvas><svg class="marks"></svg></div></div><div class="info" id="info" hidden></div></main>
<div class="col" id="right"></div><footer class="hand" id="hand"></footer><div class="over" id="war"></div>
<script src="../textures.js"></script><script src="../snapshot.js"></script><script src="../core.js"></script><script src="../panels.js"></script>
<script>
const $ = (i) => document.getElementById(i), { D, P, t, pick } = Core;
document.documentElement.style.setProperty('--nation', D.players[Core.me].color);
const box = (h, body, cls = '', extra = '') => `<section class="box ${cls}"><h4><span>${h}</span>${extra}</h4><div>${body}</div></section>`;
Panels.start({ skin: 'tile', zoom: 0.7, center: null, render(S) {
  $('bar').innerHTML = `<h1><img src="${Core.art.emblem(P.nation)}" alt="">${pick(D.names.nations[P.nation])}</h1><div class="stats">${Panels.stats()}<span class="stat">${Core.icon('ref', 22)}<b>${D.ref}</b><span class="lbl">${t('ref')}</span></span></div>${Panels.tax()}<div class="tools"><button data-zoom="1.25">+</button><button data-zoom=".8">−</button><button data-view="war">${t('warshort')}</button><button data-lang>${Core.lang() === 'ru' ? 'English' : 'Русский'}</button></div>`;
  const keep = [$('left').scrollTop, $('right').scrollTop];
  $('left').innerHTML = box(t('buildings'), Panels.buildings(), 'board') + box(t('warehouse'), Panels.warehouse(), '', `<span>${Core.RES.reduce((n, r) => n + P.wh[r], 0)} / ${D.cap}</span>`) + box(t('hold'), Panels.hold(), '', `<span>${Core.RES.reduce((n, r) => n + P.hold[r], 0)} / 4</span>`) + box(`${t('colony')}: ${Panels.name(S.focus.owner)}`, Panels.colony(S.focus, S.card || P.hand[0])) + box(t('fathers'), Panels.fathers(), 'four');
  $('left').querySelector('.board>div').style.cssText = `background:url(${Core.art.nation(P.nation)}) 50%/cover`;
  $('right').innerHTML = box(t('market'), Panels.market(), '', `<span>${t('demand')}</span>`) + box(t('pier'), Panels.pier()) + box(t('salon'), Panels.salon()) + box(t('plans'), Panels.plans()) + box(t('rivals'), Panels.rivals()) + box(t('log'), `<ul class="log">${Panels.log()}</ul>`);
  [$('left').scrollTop, $('right').scrollTop] = keep;
  $('hand').innerHTML = `<div class="cards">${P.hand.map((c) => Panels.card(c, S.card === c ? 'sel' : '')).join('')}</div><div class="acts"><div class="in">${Panels.actions(S.card, S.action)}</div></div><div class="side"><button class="pass">${t('pass')}</button><span>${P.deck}<br>${t('deck')}</span><span>${P.discard.length}<br>${t('discard')}</span></div>`;
  const st = S.sel !== null && Core.settlementAt(S.sel);
  $('info').hidden = S.sel === null; if (S.sel !== null) $('info').innerHTML = st ? Panels.native(st) : Core.colonyAt(S.sel) ? `<h3>${Panels.name(Core.colonyAt(S.sel).owner)}</h3><p>${t('defence')} <b>${Core.colonyAt(S.sel).defence}</b> ${Core.icon('sword', 14)}</p>` : Panels.cell(S.sel);
  $('war').innerHTML = `<button class="x" data-close>${t('back')}</button>` + Panels.war();
} });
</script></body></html>
