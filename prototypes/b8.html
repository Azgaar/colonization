<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>B8 Tilted map</title><link rel="stylesheet" href="kit.css"><link rel="stylesheet" href="clean.css"></head>
<body data-view="map" class="vista">
<svg width="0" height="0" style="position:absolute" id="defs"></svg><div class="map-stage"><div class="map-inner"><canvas class="sea"></canvas><canvas class="terrain"></canvas><canvas class="edge"></canvas></div><svg class="paths"></svg><div class="sprites"></div></div><div class="haze"></div><div class="vig"></div>
<header class="top"><div class="date" id="date"></div><div class="purse" id="purse"></div><div class="court" id="court"></div></header>
<div class="kingbox" id="king" hidden data-solid></div><div class="menu" id="menu" hidden data-solid></div><div class="look" id="look" hidden></div>
<div class="heaps" id="heaps"></div><div class="side" id="side"></div><button class="door west" data-go="colony" id="dw"></button><button class="door east" data-go="europe" id="de"></button>
<div class="fan w" id="fw" data-solid></div><div class="fan e" id="fe" data-solid></div>
<section class="scene s-col" id="sCol" data-solid></section><section class="scene s-eu" style="background-image:url(art/europe.webp)" id="sEu" data-solid></section>
<div class="hand" id="hand"></div><aside class="sheet" id="sheet" data-solid></aside><section class="warbox" id="war" data-solid></section>
<script src="textures.js"></script><script src="snapshot.js"></script><script src="core.js"></script><script src="panels.js"></script><script src="rich.js"></script><script src="kit.js"></script>
<script>const VIEW = { tilt: 24, depth: 55, shift: -4 };</script>
<script src="clean.js"></script></body></html>
