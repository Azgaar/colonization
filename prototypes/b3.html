<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>B3 One vista</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* B3. One vista, no panels. Europe on the horizon, the New World in the middle, home in the foreground, the way a governor would see it from the shore.

.fleet{position:absolute;right:3vw;bottom:13%;width:29vw;height:62px;z-index:3;cursor:pointer} .fleet svg{position:absolute;overflow:visible} .fleet b{position:absolute;right:0;top:-26px;font:800 24px var(--sc);color:#8e1f14;text-shadow:0 0 8px #fff9,0 0 2px #fff}

.home{position:fixed;left:0;right:0;bottom:0;height:var(--hm);z-index:4;transition:height .45s;pointer-events:none} .ground{position:absolute;inset:-4vh 0 0;background:50% 66%/cover no-repeat;-webkit-mask:linear-gradient(#0000,#000 24%);mask:linear-gradient(#0000,#000 24%)} .ground::after{content:"";position:absolute;inset:0;background:linear-gradient(#0d2b2c00 20%,#0d2b2c8c 78%)} .home>.in{position:absolute;inset:0;display:grid;grid-template-columns:minmax(220px,1fr) auto minmax(330px,1fr);gap:26px;align-items:end;padding:0 26px 16px} .home>.in>*{pointer-events:auto}

.say{position:fixed;z-index:21;pointer-events:none;background:var(--bone);color:var(--ink);border-radius:14px;padding:9px 15px 10px;box-shadow:0 8px 26px #000a;transform:translate(-50%,-100%);max-width:300px;font-size:17px} .say h3{font-size:20px;line-height:1.1} .say.no{background:#0e2f34f2;color:var(--bone)} .say .ch{display:flex;gap:6px;align-items:center;font-weight:800;margin-top:2px} .say[hidden]{display:none}
.pickr{position:fixed;z-index:22;display:flex;gap:9px;transform:translate(-50%,-100%);justify-content:center;width:max-content;max-width:94vw} .pickr[hidden]{display:none} .pickr button{background:var(--bone);color:var(--ink);border-radius:16px;overflow:hidden;min-width:104px;box-shadow:0 8px 24px #000a;font-weight:800;text-align:center;padding:9px 13px} .pickr button.im{padding:0 0 8px;width:126px} .pickr img{width:100%;height:78px;object-fit:cover;display:block;margin-bottom:5px} .pickr button:hover{outline:4px solid var(--ochre)} .pickr .ch{display:flex;gap:5px;justify-content:center;align-items:center}
.ctl{position:fixed;right:20px;top:14px;z-index:8;display:flex;gap:7px;align-items:center;color:var(--ink);font-weight:700} .ctl button{background:#fffbeecc;border-radius:99px;padding:4px 14px} .ctl button[hidden]{display:none} .ctl label{background:#fffbeecc;border-radius:99px;padding:4px 14px;display:flex;gap:9px;align-items:center} .ctl input{width:110px;accent-color:var(--scarlet)} .ctl .undo{background:var(--ochre)}
.eu{position:absolute;inset:0;z-index:5;display:none;padding:74px 26px 40px;gap:24px;align-items:flex-end;justify-content:center} .lean-eu .eu{display:flex} .lean-eu{--hz:64vh;--hm:16vh} .lean-home{--hm:62vh;--hz:13vh} .lean-eu .fleet,.lean-eu .sun{opacity:0} .lean-eu .harbour{background-size:cover;background-position:50% 60%;-webkit-mask:linear-gradient(#000 86%,#0000);mask:linear-gradient(#000 86%,#0000);opacity:1;filter:brightness(.72)} .lean-eu .year{color:#fff;text-shadow:0 2px 8px #000} .lean-eu .sky::after{display:none} .lean-eu .lots{display:none} .lean-eu .home>.in{grid-template-columns:minmax(220px,1fr) auto minmax(220px,1fr)} .lean-eu .who{height:108px;width:88px} .quay{display:flex;gap:8px} .soul{position:relative;width:99px;height:140px;border-radius:56px 56px 10px 10px;overflow:hidden;border:3px solid var(--bone);background:var(--bone)} .soul img{width:100%;height:100%;object-fit:cover;object-position:50% 5%} .soul span{position:absolute;left:0;right:0;bottom:0;background:var(--bone);color:var(--ink);font:800 14.500px/1 var(--sc);text-align:center;padding:5px 2px} .soul b{position:absolute;right:50%;top:8px;transform:translateX(50%);background:#142b2ee6;border-radius:99px;padding:0 9px 0 4px;font-size:16px;white-space:nowrap} .soul.dear{filter:saturate(.25) brightness(.8)} .stall{background:#fff9eaf0;color:var(--ink);border-radius:16px;padding:13px 18px;display:grid;grid-template-columns:30px auto;gap:5px 12px;align-items:center;font:800 23px var(--ui)} .stall .p{display:flex;gap:4px} .stall .p i{width:15px;height:24px;border-radius:4px;background:#1b282918} .stall .p i.on{background:var(--scarlet)} .shelf{display:flex;flex-direction:column;gap:12px} .grp h3{font-size:22px;margin-bottom:7px;text-shadow:0 2px 6px #000}
.fathers{display:none;position:absolute;left:26px;top:34px;gap:12px;pointer-events:auto} .lean-home .fathers{display:flex} .lean-home .lots{grid-template-columns:repeat(3,minmax(0,210px))} .lean-home .lot{height:152px} .lean-home .lot span{font-size:17px;padding:6px} .lean-home .home>.in{grid-template-columns:minmax(220px,auto) auto minmax(480px,1fr)} .lean-home .people{flex-wrap:wrap;max-width:360px}
.war{position:fixed;inset:0;z-index:30;display:none;background:radial-gradient(120% 90% at 50% 8%,#f0a35a,#a13a2b 46%,#3a1220 92%);color:#fff6e6;padding:34px 48px;overflow:auto} .war.on{display:grid;grid-template-rows:auto 1fr auto;gap:16px} .war h2{font-size:40px;line-height:1} .war header{display:flex;justify-content:space-between;align-items:flex-start;gap:30px;font-size:19px} .field{display:grid;grid-template-columns:1fr 250px 1fr;gap:34px;align-items:center} .rank{display:flex;flex-direction:column;gap:10px} .rank.l{align-items:flex-end;text-align:right} .rank b.big{font:800 96px/.9 var(--sc)} .line{display:flex;gap:10px;align-items:center;font-size:18px;font-weight:700} .rank.l .line{flex-direction:row-reverse} .men{display:flex;flex-wrap:wrap;gap:2px;max-width:330px} .rank.l .men{justify-content:flex-end} .men i{width:13px;height:21px;border-radius:7px 7px 2px 2px;background:#fff1e0} .rank.l .men i{background:#e2432f;box-shadow:inset 0 6px 0 #7a1610} .mid{text-align:center} .mid .em{width:104px;height:104px;margin:0 auto 10px;border-width:5px} .mid h3{font-size:27px;line-height:1.05} .throw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0} .throw i{font-style:normal;width:36px;height:36px;border-radius:9px;background:#fff6e6;color:var(--ink);font:800 22px/36px var(--ui);text-align:center} .throw i.hit{background:#1b1010;color:#ff8d72} .verdict{font:800 36px var(--sc)} .war footer{display:flex;gap:14px;align-items:center;justify-content:center} .war footer button,.war header button{background:#fff6e6;color:var(--ink);border-radius:99px;padding:8px 24px;font:800 19px var(--sc)} .dots{display:flex;gap:7px} .dots i{width:30px;height:30px;border-radius:50%;background:var(--c);border:3px solid #fff6e6;opacity:.5} .dots i.on{opacity:1;transform:scale(1.2)} .dots i.fell{box-shadow:inset 0 0 0 20px #0009} .score{max-width:760px;margin:0 auto;width:100%;font-size:20px} .score div{display:grid;grid-template-columns:52px 1fr auto 70px;gap:16px;align-items:center;padding:8px 0} .score .em{width:50px;height:50px} .score b{font:800 38px var(--sc);text-align:right} .score .out{opacity:.5}

</style></head><body>
<div class="sea" id="sea"><div class="plane" id="plane"><div class="deep"></div><canvas class="terrain"></canvas><svg class="marks" viewBox="0 0 1024 1024"></svg></div><div class="mist"></div></div>
<div class="sprites" id="sprites"></div>
<div class="sky" id="sky" data-zone="europe"><div class="sun" id="sun"></div><div class="harbour"></div><div class="year" id="year"></div><div class="eu" id="eu"></div><div class="fleet" id="fleet" data-war></div></div>
<div class="home" id="home"><div class="ground" id="ground"></div><div class="fathers" id="fathers"></div><div class="in" id="front"></div></div><div class="night"></div>
<div class="ctl" id="ctl"></div><div class="say" id="say" hidden role="status"></div><div class="pickr" id="pick" hidden></div><section class="war" id="war"></section>
<script src="textures.js"></script><script src="snapshot.js"></script><script src="core.js"></script><script src="panels.js"></script><script src="rich.js"></script>
<script>
const $ = (i) => document.getElementById(i), { D, P, W, me, t, pick, icon, art, at } = Core, { Sprite, preview, perform, undo, byPlace } = Rich;
const S = { card: null, drag: null, over: null, year: D.round, siege: 0, lean: '' };
const plane = $('plane'), sea = $('sea'), canvas = document.querySelector('canvas'), svg = document.querySelector('svg.marks');
const ico = (i) => ({ corn: 'food', leaf: 'crops' })[i] || i, home = () => D.colonies.find((c) => c.owner === me);
/* ---- camera ---- */
const cam = { x: at(home().cell)[0] + 200, y: at(home().cell)[1] + 60, z: 1.5 };
const aim = () => { plane.style.transform = `rotateX(47deg) scale(${cam.z}) translate(${512 - cam.x}px,${512 - cam.y}px)`; place(); };
let things = [];
function build() {
  things = [];
  const add = (cell, cls, html, data) => things.push({ cell, cls, html, data });
  for (const [c, k] of Object.entries(D.poi)) add(+c, 'poi', `<svg viewBox="0 0 64 64">${k === 'ruin' ? Sprite.ruin() : Sprite.wreck()}</svg>`);
  for (const x of D.settlements) if (x.alive) add(x.cell, 'vil', `<svg viewBox="0 0 64 64">${Sprite.village(x)}</svg><span class="tag v">${[0, 1, 2, 3, 4].map((i) => `<i style="${i < x.hostility ? `background:${x.hostility >= 4 ? '#ff6a4d' : x.hostility === 3 ? '#f0b845' : '#84d68d'}` : ''}"></i>`).join('')}</span>`);
  for (const c of D.colonies) add(c.cell, 'col', `<svg viewBox="0 0 64 64">${Sprite.colony(c)}</svg><span class="tag"><span class="em" style="--c:${D.players[c.owner].color}"><img src="${art.emblem(D.players[c.owner].nation)}" alt=""></span>${c.defence}</span>`);
  D.players.forEach((p, i) => { if (typeof p.ship === 'number') add(p.ship, 'ship', `<svg viewBox="0 0 64 64">${Sprite.ship(i)}</svg>`, i === me ? 'ship' : ''); if (typeof p.inf === 'number') add(p.inf, 'inf', `<svg viewBox="0 0 64 64">${Sprite.infantry(i)}</svg>`); });
  plane.querySelectorAll('.anchor').forEach((a) => a.remove());
  $('sprites').innerHTML = things.map((x, i) => `<div class="sp ${x.cls}" data-i="${i}" ${x.cls === 'inf' ? '' : `data-zone="${x.data === 'ship' ? 'ship' : 'cell'}" data-cell="${x.cell}"`}>${x.html}</div>`).join('');
  things.forEach((x, i) => { const a = document.createElement('div'), [l, u] = at(x.cell); a.className = 'anchor'; const shift = x.cls === 'inf' && Core.colonyAt(x.cell) ? -26 : 0; a.style.left = `${l + shift}px`; a.style.top = `${u + (x.cls === 'inf' ? 46 : 38)}px`; plane.append(a); x.a = a; x.el = $('sprites').children[i]; });
  place();
}
function place() {
  const top = sea.getBoundingClientRect().top;
  for (const x of things) { const r = x.a.getBoundingClientRect(), s = r.width / 64, k = s * 1.04; x.el.style.transform = `translate(${r.left + r.width / 2 - 32}px,${r.top - 56}px) scale(${k})`; x.el.style.zIndex = Math.round(r.top); x.el.style.opacity = r.top < top + 14 ? 0 : 1; }
}
/* ---- meaning: what dropping this agent here would do ---- */
function verbs(card, z) {
  if (!card || !z) return null;
  const pl = byPlace(card), none = (a, fb) => { const x = (D.actions[card] || []).find((q) => q.action === a); return { why: x?.why ? Core.why(x.why) : fb }; };
  if (z.zone === 'europe') return pl.europe.length ? { list: pl.europe } : { why: pick(['Your ship must reach Europe first', 'Сначала корабль должен прийти в Европу']) };
  if (z.zone === 'lot') {
    const b = P.buildings[z.lot];
    if (!b) { const l = pl.home.filter((o) => o.a === 'build'); return l.length ? { list: l, ask: true } : none('build', ''); }
    const l = pl.home.filter((o) => (o.a === 'work' && o.building === b) || (o.a === 'docks' && b === 'docks')).slice(0, 1);
    return l.length ? { list: l } : { why: D.buildings[b].work ? (D.buildings[b].work.consumes && P.wh[D.buildings[b].work.consumes.res] < 1 ? pick(['Needs crops', 'Нужно сырьё']) : none('work', '').why || pick(['Needs more education', 'Нужно образование'])) : pick(['Works by itself', 'Работает само']) };
  }
  if (z.zone === 'who') return z.card === card ? null : { list: pl.hand.filter((o) => o.other === z.card) };
  const c = z.cell, out = [...(pl.villages[c] || [])];
  if (pl.cells[c]) out.push(...[...pl.cells[c]].sort((a, b) => b.n - a.n));
  if (z.zone === 'ship' && pl.ship) return { why: pick(['Drop on the water where the ship should go', 'Отпустите на воде, куда плыть']), soft: true };
  if (pl.ship && c in Core.reach(card, 'ship') && D.terrain[c] === 'ocean') out.push({ c: 'play', card, a: 'moveShip', cell: c });
  if (pl.inf && c in Core.reach(card, 'infantry')) out.push({ c: 'play', card, a: 'moveInfantry', cell: c });
  if (out.length) return { list: out };
  const col = Core.colonyAt(c);
  if (col?.owner === me && pl.home.length) return { list: pl.home.filter((o) => o.a !== 'build'), ask: true };
  if (Core.settlementAt(c)) return { why: pick(['Too far: bring the ship or infantry next to it', 'Далеко: подведите корабль или пехоту']) };
  return { why: pick(['Out of reach this turn', 'Вне досягаемости']) };
}
const change = (o) => preview(o).rows.map((q) => `<span class="ch">${q.to - q.from > 0 ? '+' : ''}${Number.isFinite(q.to - q.from) ? q.to - q.from : `${q.from} ▸ ${q.to}`} ${icon(q.icon, 20)}</span>`).join('');
function tell(x, y, v, z) {
  const s = $('say');
  if (!v || (!v.list?.length && !v.why)) { s.hidden = true; return; }
