</style></head><body>
<div class="map-stage"><div class="map-inner"><canvas class="terrain"></canvas><svg class="marks"></svg></div></div><div class="vig"></div>
<header class="top"><div class="date" id="date"></div><div class="purse" id="purse"></div><div class="court" id="court"></div></header>
<aside class="stores" id="stores"></aside><div class="tools" id="tools"></div>
<div class="menu" id="menu" hidden></div><div class="ribbon" id="ribbon" hidden></div><div class="hand" id="hand"></div><div class="bub" id="bub" hidden role="dialog"></div>
<button class="round go-eu" data-view="europe" id="eu"></button><button class="round go-col" data-view="colony" id="col"></button><button class="round go-pass" id="pass"></button>
<aside class="sheet" id="sheet"></aside><section class="scene s-eu" style="background-image:url(art/europe.webp)" id="sEu"></section><section class="scene s-col" id="sCol"></section><section class="scene s-war" style="background-image:url(art/event/global_event_back.webp)" id="sWar"></section>
<script src="textures.js"></script><script src="snapshot.js"></script><script src="core.js"></script><script src="panels.js"></script><script src="rich.js"></script>
<script>
const $ = (i) => document.getElementById(i), { D, P, W, CELL, me, t, pick, icon, art, at, nbs, noise } = Core, { Sprite, preview, perform, undo, byPlace } = Rich;
const S = { card: null, mode: null, choice: null, menu: null, look: null, view: 'map', sheet: false, hover: null };
const canvas = document.querySelector('canvas.terrain'), svg = document.querySelector('svg.marks'), el = document.querySelector('.map-stage');
svg.setAttribute('viewBox', `0 0 ${W * 64} ${W * 64}`);
let before = {};
const ico = (i) => ({ corn: 'food', leaf: 'crops' })[i] || i;
const stage = Core.stage(el, { zoom: 1.3, center: D.colonies.find((c) => c.owner === me).cell + 3, min: 0.55, max: 2.6, onCell: clickCell });
/* Route to a cell within reach. */
function route(token, to) { const start = token === 'moveShip' ? P.ship : P.inf, r = Core.reach(S.card, token === 'moveShip' ? 'ship' : 'infantry'); if (!(to in r)) return []; const path = [to]; let c = to, g = 0; while (c !== start && g++ < 20) { const left = c === to ? r[to] : r[c]; const n = nbs(c).filter((x) => x === start || (x in r && r[x] > left)).sort((a, b) => (b === start ? 99 : r[b]) - (a === start ? 99 : r[a])); const next = nbs(c).includes(start) ? start : n.length ? n[n.length - 1] : null; if (next === null) break; path.push(next); c = next; } return path; }
function marks() {
  const o = [Core.DEFS + '<defs><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity=".5"/></filter></defs>'];
  const card = S.card, pl = card ? byPlace(card) : null;
  D.bonus.forEach((b, c) => { if (!b || (pl && pl.cells[c])) return; const [x, y] = at(c); o.push(`<g opacity=".92"><circle cx="${x + 52}" cy="${y + 52}" r="9.5" fill="#f7f1e1"/><svg x="${x + 45}" y="${y + 45}" width="14" height="14" viewBox="0 0 24 24">${Core.SHAPES[ico(b)]}</svg></g>`); });
  for (const [c, k] of Object.entries(D.poi)) { const [x, y] = at(+c); o.push(`<svg x="${x + 4}" y="${y + 2}" width="56" height="56" viewBox="0 0 64 64">${k === 'ruin' ? Sprite.ruin() : Sprite.wreck()}</svg>`); }
  // Reach as one area with a single outline.
  if (S.mode) {
    const r = Core.reach(card, S.mode === 'moveShip' ? 'ship' : 'infantry'); let d = '';
    for (const k of Object.keys(r)) { const c = +k, [x, y] = at(c), inn = (q) => q in r || q === (S.mode === 'moveShip' ? P.ship : P.inf); if (!inn(c - W)) d += `M${x} ${y}h64`; if (!inn(c + W)) d += `M${x} ${y + 64}h64`; if (!inn(c - 1)) d += `M${x} ${y}v64`; if (!inn(c + 1)) d += `M${x + 64} ${y}v64`; }
    o.push(`<g class="hit">${Object.keys(r).map((c) => `<rect x="${at(+c)[0]}" y="${at(+c)[1]}" width="64" height="64" fill="#fff" fill-opacity=".13"/>`).join('')}<path d="${d}" stroke="#fff2c4" stroke-opacity=".8" stroke-width="2.5" stroke-linecap="round" fill="none"/></g>`);
    const h = S.choice?.cell ?? S.hover;
    if (h !== null && h in r) { const p = route(S.mode, h).map((c) => { const [x, y] = at(c); return `${x + 32},${y + 32}`; }); const [x, y] = at(h); o.push(`<polyline points="${p.join(' ')}" fill="none" stroke="#fff6da" stroke-width="5" stroke-dasharray="2 11" stroke-linecap="round"/><circle cx="${x + 32}" cy="${y + 32}" r="13" fill="#ffe08a" stroke="#1c2a2a" stroke-width="2"/>`); }
  }
  const glow = (c, r = 30) => { const [x, y] = at(c); return `<ellipse cx="${x + 32}" cy="${y + 48}" rx="${r}" ry="${r * 0.45}" fill="none" stroke="#ffe08a" stroke-width="4.5"/>`; };
  const plate = (c, inner, w) => { const [x, y] = at(c); return `<g transform="translate(${x + 32 - w / 2} ${y + 57})"><rect width="${w}" height="17" rx="8.5" fill="#0f3436e6"/>${inner}</g>`; };
  const things = [];
  for (const x of D.settlements) if (x.alive) { const col = x.hostility >= 4 ? '#ee5a42' : x.hostility === 3 ? '#edb443' : '#7ccf86'; things.push([x.cell, `${pl && pl.villages[x.cell] ? glow(x.cell) : ''}<svg x="${at(x.cell)[0]}" y="${at(x.cell)[1] - 4}" width="64" height="64" viewBox="0 0 64 64">${Sprite.village(x)}</svg>` + plate(x.cell, `${[0, 1, 2, 3, 4].map((i) => `<circle cx="${9 + i * 10}" cy="8.500" r="3.400" fill="${i < x.hostility ? col : '#ffffff30'}"/>`).join('')}`, 58) + (x.ally !== null ? Core.roundel(at(x.cell)[0] - 2, at(x.cell)[1] + 2, x.ally, 18) : '')]); }
  for (const c of D.colonies) { things.push([c.cell, `${pl && c.owner === me && pl.home.length ? glow(c.cell, 33) : ''}<svg x="${at(c.cell)[0] - 2}" y="${at(c.cell)[1] - 6}" width="68" height="68" viewBox="0 0 64 64">${Sprite.colony(c)}</svg>` + plate(c.cell, `${Core.roundel(-4, -4, c.owner, 25)}<text x="28" y="13" font-size="14" font-weight="800" fill="#f7f1e1">${c.defence}</text><svg x="37" y="3" width="11" height="11" viewBox="0 0 24 24" color="#f7f1e1">${Core.SHAPES.sword}</svg>`, 54)]); }
  D.players.forEach((p, i) => {
    if (typeof p.ship === 'number') things.push([p.ship, `${pl && i === me && pl.ship ? glow(p.ship) : ''}<svg x="${at(p.ship)[0]}" y="${at(p.ship)[1] - 3}" width="64" height="64" viewBox="0 0 64 64">${Sprite.ship(i)}</svg>`]);
    if (typeof p.inf === 'number') { const c = Core.colonyAt(p.inf), [x, y] = at(p.inf); things.push([p.inf + 0.5, `${pl && i === me && pl.inf ? `<ellipse cx="${x + (c ? 6 : 32)}" cy="${y + (c ? 50 : 56)}" rx="17" ry="7" fill="none" stroke="#ffe08a" stroke-width="4"/>` : ''}<svg x="${x + (c ? -22 : 0)}" y="${y + (c ? 2 : 0)}" width="${c ? 56 : 64}" height="${c ? 56 : 64}" viewBox="0 0 64 64">${Sprite.infantry(i)}</svg>`]); }
  });
