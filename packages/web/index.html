<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Colonization</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><style>
/* The loading screen: painted at once, before the stylesheets and fonts arrive. Its compass turns clockwise, a quarter at a time (the star looks the same every quarter), in a plain box (not the SVG itself), which browsers animate apart from the page's script, so it keeps moving while the map is painted.
   It is never taken out of the page, only faded: the swing runs from the first paint and never has to start again on a busy page. */
html{background:#0c3352}
#loading{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:radial-gradient(70% 70% at 50% 45%,#1e6189,#12476f 55%,#0c3352);transition:opacity .7s,visibility 0s}
#loading.done{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .7s,visibility 0s .7s}
#loading .needle{width:min(168px,26vmin);animation:needle 3.6s ease-in-out infinite;will-change:transform}
#loading svg{display:block;width:100%}
@keyframes needle{0%{transform:rotate(0)}25%{transform:rotate(90deg)}50%{transform:rotate(180deg)}75%{transform:rotate(270deg)}100%{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#loading .needle{animation-duration:10s}}
</style></head>
